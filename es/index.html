<style>
:root{--bg:#07100b;--panel:#0b1710;--panel2:#0f2117;--line:#203b2a;--text:#f3f7f4;--muted:#83978a;--green:#66e08a;--green2:#b9ffca;--red:#ff667a;--amber:#f0c96b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07100b;color:var(--text)}
body{background:radial-gradient(circle at 50% -20%,#17482b 0,transparent 34%),#07100b}
a{color:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}
header{height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:26px;font-weight:950;letter-spacing:-1px}.brand b{color:var(--green)}
.top{display:flex;align-items:center;gap:8px}.pill,.lang,.admin-link{border:1px solid var(--line);background:#0b1a12;color:#cfe0d3;border-radius:999px;padding:8px 10px;text-decoration:none;font-size:10px;font-weight:900}.admin-link{background:var(--green);color:#07100b}
.hero{padding:28px 0 18px}.hero h1{font-size:clamp(32px,5vw,58px);letter-spacing:-2.5px;line-height:1;margin:0 0 10px}.hero h1 span{color:var(--green)}.hero p{margin:0;color:#93a79a;font-size:14px;line-height:1.55}
.board{display:grid;grid-template-columns:230px 1fr;gap:14px;padding-bottom:60px}
.sidebar,.mainbox{border:1px solid var(--line);background:#08140d;border-radius:18px;overflow:hidden}.sidebar{height:max-content;position:sticky;top:12px}
.side-title{padding:14px 15px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#758a7c;border-bottom:1px solid var(--line);font-weight:900}.side-btn{width:100%;border:0;border-bottom:1px solid #172c20;background:transparent;color:#b7c7bc;text-align:left;padding:12px 15px;cursor:pointer;font-size:12px}.side-btn:hover,.side-btn.active{background:#102419;color:#fff}.side-btn b{float:right;color:#789084}
.datebar{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;overflow:auto;background:#0a1710;scrollbar-width:none}.datebar::-webkit-scrollbar{display:none}
.day{min-width:88px;border:1px solid #1d3928;background:#0a1710;color:#9db0a2;border-radius:12px;padding:9px 8px;text-align:center;cursor:pointer}.day strong{display:block;color:#dce8df;font-size:11px}.day span{display:block;font-size:9px;margin-top:3px}.day.active{background:#163724;border-color:#4da96b}.day.active strong{color:#fff}.navday{min-width:36px;height:42px;border:1px solid #1d3928;background:#0a1710;color:#c6d4ca;border-radius:11px;cursor:pointer}
.toolbar{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line);align-items:center}.filter{border:1px solid #1e3a29;background:#0a1710;color:#aebfb3;padding:8px 11px;border-radius:999px;font-size:10px;font-weight:900;cursor:pointer}.filter.active{background:var(--green);border-color:var(--green);color:#06100b}.count{margin-left:auto;font-size:10px;color:#72867a}
.loading,.empty,.error{padding:46px 20px;text-align:center;color:#829487}.error{color:#ff9aa6}.spinner{width:28px;height:28px;border:3px solid #20402d;border-top-color:var(--green);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.league{border-top:1px solid #1b3324}.league:first-child{border-top:0}.league-head{display:flex;align-items:center;gap:9px;padding:11px 14px;background:#0c1a12;position:sticky;top:0}.league-head img{width:20px;height:20px;object-fit:contain}.league-head .country{font-size:9px;color:#718778;text-transform:uppercase;font-weight:900}.league-head .name{font-size:12px;font-weight:900}.league-head .games-count{margin-left:auto;color:#6f8576;font-size:9px}
.game{display:grid;grid-template-columns:64px 1fr 58px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid #15291d;cursor:pointer;transition:.15s}.game:hover{background:#0d1f15}.time{text-align:center;font-size:11px;color:#93a799}.time.live{color:#ff7e8d;font-weight:950}.teams{display:grid;gap:7px}.team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}.team img{width:20px;height:20px;object-fit:contain}.team.winner{font-weight:950;color:#fff}.score{text-align:center;font-size:16px;font-weight:950}.score small{display:block;font-size:8px;color:#6f8275;font-weight:800;margin-top:3px}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff667a;margin-right:4px;box-shadow:0 0 10px #ff667a}
.source{padding:10px 14px;border-top:1px solid var(--line);font-size:9px;color:#607467}.source b{color:#7f9686}
@media(max-width:820px){header{height:62px}.pill{display:none}.board{grid-template-columns:1fr}.sidebar{position:static;display:none}.hero{padding:18px 0 14px}.hero h1{font-size:38px}.game{grid-template-columns:54px 1fr 48px;padding:10px}.team{font-size:11px}.datebar{padding:9px}.day{min-width:78px}.mainbox{border-radius:14px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/visitor-tracker.js"></script><script defer src="/admin-access.js"></script></head>

<section class="hero"><h1>Todos los partidos. <span>Todos los días.</span></h1><p>Elige la fecha y sigue partidos, competiciones, horarios y resultados del fútbol mundial.</p></section>
