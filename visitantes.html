Content=x.visitors_7d??0;const rows=r.data||[];$('table').innerHTML=rows.length?'<table><thead><tr><th>Última atividade</th><th>Primeira visita</th><th>Visitas</th><th>Página</th><th>Origem</th><th>Navegador</th></tr></thead><tbody>'+rows.map(v=>'<tr><td>'+dt(v.last_seen)+'</td><td>'+dt(v.first_seen)+'</td><td>'+v.visit_count+'</td><td>'+esc(v.last_path||'—')+'</td><td>'+esc(v.last_referrer||'Direto / desconhecido')+'</td><td class="small">'+esc(v.user_agent||'—')+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">Ainda não há visitantes registrados.</div>'}init();</script></body></html>
