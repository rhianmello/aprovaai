<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nós Passa — Escolha seu concurso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#06080b;--panel:#0e141b;--line:#293541;--text:#f7f8fa;--muted:#96a2ae;--gold:#e4c64a;--gold2:#f2d86b;--ok:#53d5a0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 0,#18232d,#06080b 44%);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:27px;font-weight:950;color:#fff;text-decoration:none}.brand b{color:var(--gold)}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:11px 15px;background:var(--gold);color:#111;text-decoration:none;font-size:12px;font-weight:950;border:0;cursor:pointer}.secondary{background:#151c24;color:#fff;border:1px solid #35404b}.hero{padding:60px 0 35px;text-align:center}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:#211d0c;color:var(--gold2);border:1px solid #4a411c;font-size:10px;font-weight:950;letter-spacing:1.4px}.hero h1{font-size:clamp(38px,6vw,62px);letter-spacing:-3px;line-height:.98;margin:17px 0 10px}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{max-width:720px;margin:auto;color:var(--muted);line-height:1.65}.tools{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:28px 0 20px}.tools input,.tools select{width:100%;background:#0d1319;color:#fff;border:1px solid var(--line);border-radius:10px;padding:13px}.group{border:1px solid var(--line);border-radius:17px;background:#0c1117;margin:13px 0;overflow:hidden}.group summary{cursor:pointer;padding:17px 19px;font-weight:950;list-style:none;display:flex;justify-content:space-between;gap:12px}.group summary span{color:var(--muted);font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding:0 13px 13px}.card{display:flex;flex-direction:column;min-height:280px;padding:19px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#111821,#0b0f14)}.icon{font-size:28px}.tag{display:inline-flex;align-self:flex-start;margin-top:11px;padding:5px 8px;border-radius:7px;background:#13261f;color:var(--ok);font-size:9px;font-weight:950}.card h3{font-size:17px;line-height:1.3;margin:12px 0 7px}.card p{color:var(--muted);font-size:11px;line-height:1.55;margin:0 0 15px}.foot{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:auto}.price strong{display:block;font-size:20px}.price span{font-size:8px;color:#7f8994}.empty,.loading{padding:30px;text-align:center;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:18px}.tools{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.foot{align-items:flex-start;flex-direction:column}.foot .btn{width:100%}}</style><script src="visitor-tracker.js"></script></head><body><main class="wrap"><header class="nav"><a class="brand" href="concursos.html">Nós <b>Passa</b></a><a class="btn secondary" href="minha-conta.html">Minha conta</a></header><section class="hero"><span class="eyebrow">ESCOLHA SUA PREPARAÇÃO</span><h1>Qual concurso você quer<br><em>começar agora?</em></h1><p>Selecione o concurso e o cargo. Você será levado diretamente ao checkout daquela preparação. Não precisa voltar e procurar o curso novamente.</p></section><section><div class="tools"><input id="search" placeholder="🔎 Buscar cargo, concurso ou área…"><select id="group"><option value="">Todos os concursos</option></select></div><div id="catalog"><div class="loading">Carregando cursos…</div></div></section></main><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d',sb=supabase.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});let courses=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function group(c){if(c.slug?.startsWith('transpetro-2026-03-'))return'Transpetro 2026 • Terra • Nível Médio';if(c.slug?.startsWith('transpetro-2026-04-'))return'Transpetro 2026 • Terra • Nível Superior';if(c.slug?.startsWith('transpetro-2026-01-'))return'Transpetro 2026 • Mar • Suboficiais e Guarnição';if(c.slug?.startsWith('transpetro-2026-02-'))return'Transpetro 2026 • Mar • Oficiais';if(c.slug==='transpetro')return'Transpetro 2026 • Terra • Nível Superior';if(c.slug==='ace-marica')return'ACE Maricá';return'Outros cursos'}function icon(c){const s=(c.name||'').toLowerCase();if(s.includes('mar'))return'⚓';if(s.includes('engenharia')||s.includes('elétrica')||s.includes('automação')||s.includes('eletricista'))return'⚙️';if(s.includes('saúde')||s.includes('enfermagem')||s.includes('medicina')||s.includes('nutrição')||s.includes('odontologia'))return'🩺';if(s.includes('ambiental')||s.includes('química'))return'🌱';return'📚'}function render(){const q=document.getElementById('search').value.trim().toLowerCase(),f=document.getElementById('group').value;const list=courses.filter(c=>(!f||c.group===f)&&(!q||[c.name,c.group,c.description].join(' ').toLowerCase().includes(q)));const groups=[...new Set(list.map(c=>c.group))];document.getElementById('catalog').innerHTML=groups.length?groups.map(g=>{const a=list.filter(c=>c.group===g);return `<details class="group" open><summary>${esc(g)} <span>${a.length} preparação${a.length===1?'':'ões'}</span></summary><div class="grid">${a.map(c=>`<article class="card"><div class="icon">${icon(c)}</div><span class="tag">PREPARAÇÃO COMPLETA</span><h3>${esc(c.name)}</h3><p>${esc(c.description||'Questões, simulados, plano de estudo e desempenho para o cargo selecionado.')}</p><div class="foot"><div class="price"><strong>R$ 1</strong><span>por mês</span></div><a class="btn" href="checkout-popular.html?course=${encodeURIComponent(c.slug||c.id)}">Escolher este curso →</a></div></article>`).join('')}</div></details>`}).join(''):'<div class="empty">Nenhuma preparação encontrada. Tente outro termo ou grupo.</div>'}async function init(){try{const{data,error}=await sb.from('courses').select('id,name,slug,description,active').eq('active',true).order('id');if(error)throw error;courses=(data||[]).map(c=>({...c,group:group(c)}));document.getElementById('group').innerHTML='<option value="">Todos os concursos</option>'+[...new Set(courses.map(c=>c.group))].sort().map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');document.getElementById('search').oninput=render;document.getElementById('group').onchange=render;render()}catch(e){document.getElementById('catalog').innerHTML='<div class="empty">Não foi possível carregar as preparações. <a href="concursos.html" style="color:#e4c64a">Ver catálogo público</a>.</div>'}}init();</script></body></html>
