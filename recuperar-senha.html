<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nós Passa — Recuperar senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1014;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#181d23;border:1px solid #303740;border-radius:20px;padding:28px}.logo{font-size:28px;font-weight:900;color:#fff;text-decoration:none}.logo b{color:#e4c64a}h1{margin:22px 0 8px}p{color:#a6adb7;line-height:1.5}label{display:block;margin-top:14px;color:#d8dde5;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid #343b45;background:#11161b;color:#fff;font-size:16px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer}.secondary{background:#2b3139;color:#fff}.msg{margin-top:14px;color:#ff9b9b}.ok{color:#8be3b7}.link{color:#ddd;text-decoration:none;font-size:13px}</style><script src="visitor-tracker.js"></script></head><body><main class="box"><a class="logo" href="index.html">Nós <b>Passa</b></a><h1>Recuperar senha</h1><p>Informe seu e-mail. Enviaremos um link para você criar uma nova senha.</p><form id="form"><label>E-mail<input id="email" type="email" autocomplete="email" required></label><div class="actions"><button class="btn" id="submit" type="submit">Enviar link</button><a class="btn secondary" href="login.html">Voltar</a></div></form><div id="msg" class="msg"></div></main><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_'+'Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';const form=document.getElementById('form'),email=document.getElementById('email'),submit=document.getElementById('submit'),msg=document.getElementById('msg');function setMsg(t,ok=false){msg.className=ok?'msg ok':'msg';msg.textContent=t}function friendly(e){const s=String(e?.message||e||'').toLowerCase();if(s.includes('rate limit'))return'Muitas solicitações. Aguarde alguns minutos e tente novamente.';if(s.includes('network')||s.includes('fetch'))return'Não foi possível conectar ao serviço. Verifique sua internet e tente novamente.';return'Não foi possível enviar o link. Confira o e-mail e tente novamente.'}async function load(){if(window.supabase?.createClient)return window.supabase;return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>ok(window.supabase);s.onerror=()=>no(new Error('Supabase não carregou'));document.head.appendChild(s)})}form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;setMsg('Enviando link...');try{const api=await load(),sb=api.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const redirectTo=new URL('atualizar-senha.html',location.origin).href;const r=await sb.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo});if(r.error)throw r.error;setMsg('Se houver uma conta com este e-mail, o link de recuperação foi enviado. Verifique também o spam.',true);form.reset()}catch(e){setMsg(friendly(e))}finally{submit.disabled=false}}</script></body></html>
