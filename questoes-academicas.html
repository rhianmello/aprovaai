<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nós Passa — Questões</title><style>:root{--bg:#070a0e;--panel:#10161d;--line:#28333e;--text:#f4f7fa;--muted:#98a5b2;--accent:#e4c64a;--ok:#39c98a;--bad:#f06b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#151d27 0,#070a0e 45%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#fff;text-decoration:none;font-size:22px}.brand b{color:var(--accent)}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#111;font-weight:800;cursor:pointer}.btn.secondary{background:#151c24;color:#fff;border:1px solid var(--line)}.hero{padding:34px 0 20px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:800}.hero h1{margin:7px 0;font-size:32px}.muted{color:var(--muted);line-height:1.55}.filters,.card{background:#10161dcc;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field select{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0b1015;color:#fff}.progress{height:7px;background:#202932;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.qmeta{font-size:12px;color:var(--muted);margin-bottom:10px}.statement{font-size:20px;line-height:1.55;font-weight:700}.alts{display:grid;gap:9px;margin-top:18px}.alt{width:100%;text-align:left;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0c1218;color:#fff;cursor:pointer}.alt:hover{border-color:#657381}.alt.correct{border-color:var(--ok);background:#123022}.alt.wrong{border-color:var(--bad);background:#321919}.explain{margin-top:16px;padding:14px;border-radius:10px;background:#0b1116;color:#c8d0d8;line-height:1.55}.hidden{display:none}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:700px){.wrap{padding:16px}.filters{grid-template-columns:1fr}.hero h1{font-size:25px}.statement{font-size:17px}.top{align-items:flex-start}}</style><script src="visitor-tracker.js"></script></head><body><main class="wrap"><header class="top"><a class="brand" href="minha-conta.html">Nós <b>Passa</b></a><a class="btn secondary" id="back" href="meu-plano.html">Meu Plano</a></header><section class="hero"><span class="eyebrow">PRÁTICA INTELIGENTE</span><h1>Questões da sua preparação</h1><p class="muted" id="prepName">Carregando preparação...</p></section><section class="filters"><div class="field"><label>Disciplina</label><select id="subject"><option value="">Todas</option></select></div><div class="field"><label>Item do edital</label><select id="topic"><option value="">Todos</option></select></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b id="counter">Carregando...</b><span id="score" class="muted">0 acertos</span></div><div class="progress" style="margin-top:10px"><i id="bar"></i></div></section><section id="question" class="card"><div class="empty">Carregando questões...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';
const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d',sb=supabase.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);let user=null,course=null,preparation=null,all=[],filtered=[],idx=0,answered=false,correct=0;
async function resolveContext(){const params=new URLSearchParams(location.search),slug=(params.get('course')||'').trim();if(!slug)throw new Error('Curso não informado.');$('back').href='meu-plano.html?course='+encodeURIComponent(slug);const cr=await sb.from('courses').select('id,name,slug,active').eq('slug',slug).eq('active',true).maybeSingle();if(cr.error)throw cr.error;if(!cr.data)throw new Error('Curso não encontrado ou inativo.');course=cr.data;const access=await sb.from('user_courses').select('id,status,starts_at,expires_at').eq('user_id',user.id).eq('course_id',course.id).eq('status','active').maybeSingle();if(access.error)throw access.error;if(!access.data)throw new Error('Você não possui acesso ativo a este curso.');const now=Date.now();if(access.data.starts_at&&Date.parse(access.data.starts_at)>now)throw new Error('Seu acesso ainda não começou.');if(access.data.expires_at&&Date.parse(access.data.expires_at)<=now)throw new Error('Seu acesso está expirado.');const pr=await sb.from('course_preparations').select('preparation_id,preparations(id,name,slug)').eq('course_id',course.id).eq('active',true).maybeSingle();if(pr.error)throw pr.error;if(!pr.data?.preparations)throw new Error('Preparação não encontrada para este curso.');preparation=pr.data.preparations;$('prepName').textContent=preparation.name||course.name;}
async function init(){const session=(await sb.auth.getSession()).data.session;if(!session?.user){location.href='login.html';return}user=session.user;await resolveContext();const bank=await sb.rpc('load_student_question_bank',{p_course_id:course.id,p_preparation_id:preparation.id});if(bank.error)throw bank.error;all=(bank.data||[]).map(q=>({id:q.id,statement:q.enunciado,alternatives:q.alternativas,answer:q.gabarito,explanation:q.explicacao,tipo:q.tipo,texto_base:q.texto_base,figura:q.figura,source_reference:q.fonte,subject:q.disciplina||'',topic:q.assunto||''}));fillFilters();const requested=new URLSearchParams(location.search).get('topic');if(requested){const found=all.find(x=>x.topic===requested);if(found){$('subject').value=found.subject;fillTopics();$('topic').value=found.topic}}apply();}
function fillFilters(){const subs=[...new Set(all.map(x=>x.subject).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));$('subject').innerHTML='<option value="">Todas</option>'+subs.map(x=>'<option>'+esc(x)+'</option>').join('');$('subject').onchange=()=>{fillTopics();apply()};$('topic').onchange=apply;fillTopics()}
function fillTopics(){const s=$('subject').value;const ts=[...new Set(all.filter(x=>!s||x.subject===s).map(x=>x.topic).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));$('topic').innerHTML='<option value="">Todos</option>'+ts.map(x=>'<option>'+esc(x)+'</option>').join('')}
function apply(){const s=$('subject').value,t=$('topic').value;filtered=all.filter(x=>(!s||x.subject===s)&&(!t||x.topic===t));idx=0;answered=false;render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizedAnswer(value){const token=String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();return token==='certa'?'certo':token==='errada'?'errado':token}
function isTrueFalseQuestion(q){return normalizedAnswer(q?.tipo).replace(/[\s/-]+/g,'_')==='certo_errado'&&['certo','errado'].includes(normalizedAnswer(q?.answer))}
function answerOptions(q){if(isTrueFalseQuestion(q))return[{letra:'Certo',texto:''},{letra:'Errado',texto:''}];if(Array.isArray(q.alternatives))return q.alternatives;return Object.entries(q.alternatives||{}).filter(([,v])=>String(v??'').trim()).map(([letra,texto])=>({letra,texto}))}
function render(){if(!filtered.length){$('question').innerHTML='<div class="empty">Nenhuma questão disponível para este filtro.</div>';$('counter').textContent='0 questões';$('bar').style.width='0';return}const q=filtered[idx],trueFalse=isTrueFalseQuestion(q),alts=answerOptions(q);$('counter').textContent=`Questão ${idx+1} de ${filtered.length}`;$('score').textContent=`${correct} acertos`;$('bar').style.width=((idx)/filtered.length*100)+'%';$('question').innerHTML=`<div class="qmeta">${esc(q.subject)} · ${esc(q.topic)}</div><div class="statement">${esc(q.statement)}</div><div class="alts">${alts.map(a=>trueFalse?`<button class="alt" data-a="${esc(a.letra)}">${esc(a.letra)}</button>`:`<button class="alt" data-a="${esc(a.letra)}"><strong>${esc(a.letra)}</strong>${esc(a.texto)}</button>`).join('')}</div><div id="explain" class="explain hidden"></div><div class="nav"><button class="btn secondary" id="prev" ${idx===0?'disabled':''}>Anterior</button><button class="btn" id="next" disabled>Próxima</button></div>`;document.querySelectorAll('.alt').forEach(b=>b.onclick=()=>answer(b.dataset.a));$('prev').onclick=()=>{if(idx>0){idx--;answered=false;render()}};$('next').onclick=()=>{if(idx<filtered.length-1){idx++;answered=false;render()}else{$('question').innerHTML='<div class="empty"><h2>Bloco concluído!</h2><p>Você terminou as questões deste filtro.</p><button class="btn" onclick="apply()">Recomeçar</button></div>'}}}
async function answer(letter){if(answered)return;answered=true;const q=filtered[idx],selected=normalizedAnswer(letter),expected=normalizedAnswer(q.answer),ok=selected===expected,selectedAnswer=isTrueFalseQuestion(q)?(selected==='certo'?'Certo':'Errado'):letter;if(ok)correct++;document.querySelectorAll('.alt').forEach(b=>{if(normalizedAnswer(b.dataset.a)===expected)b.classList.add('correct');else if(normalizedAnswer(b.dataset.a)===selected)b.classList.add('wrong');b.disabled=true});$('explain').classList.remove('hidden');$('explain').innerHTML='<b>'+(ok?'Correta':'Incorreta')+'</b><br>'+esc(q.explanation||'Sem explicação cadastrada.');$('next').disabled=false;try{await sb.from('question_attempts').insert({user_id:user.id,question_id:q.id,preparation_id:preparation.id,selected_answer:selectedAnswer,is_correct:ok,answered_at:new Date().toISOString()})}catch(e){console.warn('[Questões] tentativa não persistida',e)}$('score').textContent=`${correct} acertos`}
init().catch(e=>{$('question').innerHTML='<div class="empty">'+esc(e.message||'Não foi possível carregar as questões.')+'</div>';$('counter').textContent='Erro ao carregar';console.error('[Questões]',e)});
</script></body></html>
