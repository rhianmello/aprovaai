<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tráfego — Nós Passa</title>
<style>body{margin:0;background:#07100b;color:#f5f7f5;font-family:Arial,sans-serif}.w{max-width:1000px;margin:auto;padding:34px 18px}h1{font-size:36px}.box,.k{border:1px solid #25402f;background:#0b1b12;border-radius:16px;padding:18px}.login{max-width:420px}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{padding:12px;border-radius:10px;border:1px solid #31503a;background:#08140d;color:#fff}input{width:100%;margin:6px 0}button{background:#67e08c;color:#06100b;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.k small{color:#9eb2a4}.k b{display:block;font-size:30px;margin-top:7px}.panel{margin-top:12px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #25402f;text-align:left;font-size:12px}.muted{color:#9eb2a4;font-size:12px}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="w"><h1>Tráfego do Nós Passa</h1>
<div id="login" class="box login"><p class="muted">Entre com sua conta administrativa do Nós Passa.</p><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="msg" class="muted"></p></div>
<div id="dash" class="hide"><div class="row"><select id="period"><option value="1">Hoje</option><option value="7" selected>Últimos 7 dias</option><option value="30">Últimos 30 dias</option></select><button id="refresh">Atualizar</button><button id="logout">Sair</button></div>
<div class="grid"><div class="k"><small>Visitantes</small><b id="v">—</b></div><div class="k"><small>Visitas</small><b id="s">—</b></div><div class="k"><small>Páginas vistas</small><b id="p">—</b></div><div class="k"><small>Online agora</small><b id="o">—</b></div></div>
<div class="box panel"><h3>Origens</h3><div id="sources"></div></div><div class="box panel"><h3>Países</h3><div id="countries"></div></div><div class="box panel"><h3>Páginas</h3><div id="pages" class="table"></div></div></div></div>
<script>
const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';
const sb=supabase.createClient(U,K);const $=id=>document.getElementById(id);const num=x=>Number(x||0).toLocaleString('pt-BR');
async function authOK(){const a=await sb.auth.getSession();if(!a.data.session)return false;const r=await sb.rpc('is_admin');return !r.error&&r.data===true}
async function load(){const days=Number($('period').value);const end=new Date(),start=new Date();if(days===1)start.setHours(0,0,0,0);else start.setDate(start.getDate()-(days-1));const r=await sb.rpc('admin_visitor_analytics',{p_start:start.toISOString(),p_end:end.toISOString()});if(r.error){$('msg').textContent=r.error.message;return}const d=r.data||{},x=d.summary||{};$('v').textContent=num(x.visitors);$('s').textContent=num(x.visits);$('p').textContent=num(x.pageviews);$('o').textContent=num(x.online_now);
$('sources').innerHTML=(d.sources||[]).slice(0,10).map(x=>'<p>'+String(x.source||'Direto')+' — <b>'+num(x.pageviews||x.visitors)+'</b></p>').join('')||'<p class="muted">Sem dados.</p>';
$('countries').innerHTML=(d.countries||[]).slice(0,10).map(x=>'<p>'+String(x.country_code||'—')+' — <b>'+num(x.visitors)+'</b></p>').join('')||'<p class="muted">Sem dados.</p>';
$('pages').innerHTML='<table><thead><tr><th>Página</th><th>Views</th><th>Visitantes</th></tr></thead><tbody>'+(d.pages||[]).slice(0,20).map(x=>'<tr><td>'+String(x.path||'')+'</td><td>'+num(x.pageviews)+'</td><td>'+num(x.visitors)+'</td></tr>').join('')+'</tbody></table>'}
async function show(){if(await authOK()){$('login').classList.add('hide');$('dash').classList.remove('hide');load()}}
$('enter').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error){$('msg').textContent='Login inválido.';return}if(!(await authOK())){$('msg').textContent='Esta conta não é administradora.';await sb.auth.signOut();return}show()};
$('refresh').onclick=load;$('period').onchange=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};show();
</script></body></html>
