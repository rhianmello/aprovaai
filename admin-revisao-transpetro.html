<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisão Editorial Transpetro | Nós Passa</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080c10;--panel:#151c24;--line:#2b3642;--gold:#e4c64a;--muted:#9da8b5;--text:#f7f8fa;--ok:#7fe1b4;--danger:#ff9b9b;--warn:#f2d86b;--blue:#8fc5ff}
*{box-sizing:border-box}body{margin:0;background:#080c10;color:var(--text);font:15px Inter,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1440px;margin:auto;padding:24px}.panel,.question{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.top,.toolbar,.actions,.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0 0 6px}.muted{color:var(--muted)}.btn{border:0;border-radius:9px;padding:10px 13px;background:var(--gold);color:#111;font-weight:900;cursor:pointer}.btn.secondary{background:#222d38;color:#fff;border:1px solid #3b4855}.btn.danger{background:#4a2429;color:#ffc1c1}.btn:disabled{opacity:.45;cursor:not-allowed}.auth{margin-top:10px}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.stat{background:#10161c;border:1px solid var(--line);border-radius:11px;padding:13px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.stat strong{display:block;font-size:24px;margin-top:5px}.filters{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px}label{display:block;color:#cbd3dc;font-size:12px;font-weight:800;margin-bottom:6px}select,input,textarea{width:100%;background:#0d1319;color:#fff;border:1px solid #394653;border-radius:9px;padding:10px;font:inherit}textarea{min-height:86px;resize:vertical}.question-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:99px;background:#24303b;font-size:11px;font-weight:900}.badge.ok{background:#173126;color:var(--ok)}.badge.warn{background:#403619;color:var(--warn)}.badge.bad{background:#442b2e;color:var(--danger)}.statement{white-space:pre-wrap;font-size:16px;line-height:1.6;margin:16px 0}.source-text,.explanation{white-space:pre-wrap;background:#0e141a;border-left:3px solid #536170;padding:13px;line-height:1.55}.alternatives{display:grid;gap:7px;margin:13px 0}.alternative{background:#101820;border:1px solid #293541;border-radius:9px;padding:10px}.answer{color:var(--ok);font-weight:900}.meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.meta div{background:#10161c;border:1px solid #27323d;border-radius:8px;padding:9px;min-width:0;overflow-wrap:anywhere}.meta b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;margin-bottom:4px}.editor{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px}.span2{grid-column:span 2}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.figure{max-width:100%;max-height:480px;border-radius:9px;border:1px solid var(--line)}.notice{padding:12px;border-radius:9px;background:#2f2914;color:#ffe788;margin:10px 0}.error{padding:14px;background:#351e22;color:#ffb8b8;border:1px solid #65343b;border-radius:10px;white-space:pre-wrap}.success{padding:12px;background:#173126;color:var(--ok);border-radius:9px}.empty{text-align:center;color:var(--muted);padding:30px}.pager{justify-content:center}.count{color:var(--muted)}
@media(max-width:1000px){.stats{grid-template-columns:repeat(3,1fr)}.filters,.form-grid{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.wrap{padding:12px}.stats,.filters,.form-grid,.meta{grid-template-columns:1fr}.span2{grid-column:auto}}
</style>
<script src="visitor-tracker.js"></script></head>
<body><div class="wrap">
<section class="panel"><div class="top"><div><h1>Revisão Editorial Transpetro</h1><div class="muted">Língua Portuguesa · PSP Terra — Nível Médio — 2026.3 · decisão única para 18 cargos</div></div><button class="btn secondary" onclick="location.href='admin.html'">← Voltar ao Admin</button></div><div id="auth" class="auth muted">Validando sessão administrativa…</div></section>
<section id="app" class="hidden">
<section class="panel"><div class="stats">
<div class="stat"><span>Total</span><strong id="cTotal">—</strong></div><div class="stat"><span>Aderentes</span><strong id="cAderente">—</strong></div><div class="stat"><span>Revisar</span><strong id="cRevisar">—</strong></div><div class="stat"><span>Não aderentes</span><strong id="cNao">—</strong></div><div class="stat"><span>Qualidade pendente</span><strong id="cQualidade">—</strong></div><div class="stat"><span>Revisadas manualmente</span><strong id="cManual">—</strong></div>
</div></section>
<section class="panel"><div class="filters">
<div><label>Status</label><select id="fStatus"><option value="">Todos</option><option>ADERENTE</option><option>REVISAR</option><option>NAO_ADERENTE</option></select></div>
<div><label>Tópico do edital</label><select id="fTopic"><option value="">Todos</option></select></div>
<div><label>Assunto QAPI</label><select id="fAssunto"><option value="">Todos</option></select></div>
<div><label>Banca</label><select id="fBanca"><option value="">Todas</option></select></div>
<div><label>Ano</label><select id="fYear"><option value="">Todos</option></select></div>
<div><label>Tipo</label><select id="fType"><option value="">Todos</option></select></div>
<div><label>Qualidade editorial</label><select id="fQuality"><option value="">Todas</option><option>PENDENTE</option><option>APROVADA</option><option>REVISAR</option><option>REPROVADA</option></select></div>
<div><label>Busca no enunciado</label><input id="fText" type="search" placeholder="Palavra ou expressão"></div>
</div><div class="toolbar" style="margin-top:12px"><span id="resultCount" class="count"></span><button class="btn secondary" id="clearFilters">Limpar filtros</button></div></section>
<div id="message"></div><div id="list"><div class="empty">Carregando 414 questões…</div></div>
<div class="panel pager"><button id="prev" class="btn secondary">← Anterior</button><span id="pageInfo"></span><button id="next" class="btn secondary">Próxima →</button></div>
</section></div>
<script>
const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const TOPICS=['Compreensão de textos de gêneros variados','Ortografia oficial','Mecanismos de coesão textual','Emprego das classes de palavras','Concordância nominal e verbal','Emprego do sinal indicativo de crase','Sinais de pontuação','Significação das palavras'];
const PAGE_SIZE=12,$=id=>document.getElementById(id);let rows=[],filtered=[],page=1,busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function val(v){return v===null||v===undefined||v===''?'—':String(v)}
function payload(r){return r.source_payload&&typeof r.source_payload==='object'?r.source_payload:{}}
function textBase(r){const p=payload(r);return p.texto_base??p.textoBase??p.texto??p.text??null}
function figureValue(r){const p=payload(r);return p.figura??p.figure??p.imagem??p.image??null}
function safeFigure(v){if(v&&typeof v==='object')v=v.url??v.src??v.data??null;if(typeof v!=='string')return null;const s=v.trim();if(/^https?:\/\//i.test(s))return s;if(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(s))return s;return null}
function alternatives(v){if(!v)return[];if(Array.isArray(v))return v.map((x,i)=>typeof x==='object'?{k:x.letter??x.key??x.label??String.fromCharCode(65+i),t:x.text??x.value??x.alternative??JSON.stringify(x)}:{k:String.fromCharCode(65+i),t:x});if(typeof v==='object')return Object.entries(v).map(([k,t])=>({k,t:typeof t==='object'?(t.text??t.value??JSON.stringify(t)):t}));return[]}
function typeLabel(r){const t=String(r.question_type||payload(r).tipo||'').toLowerCase();return /certo|errado|true|false/.test(t)||alternatives(r.alternatives).length===0?'Certo/Errado':'Múltipla escolha'}
function badge(s){const c=s==='ADERENTE'||s==='APROVADA'?'ok':s==='NAO_ADERENTE'||s==='REPROVADA'?'bad':'warn';return '<span class="badge '+c+'">'+esc(val(s))+'</span>'}
function uniq(key){return [...new Set(rows.map(key).filter(x=>x!==null&&x!==undefined&&x!==''))].sort((a,b)=>String(a).localeCompare(String(b),'pt-BR',{numeric:true}))}
function options(values){return values.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')}
function setSelects(){$('fTopic').innerHTML='<option value="">Todos</option>'+options(TOPICS);$('fAssunto').innerHTML='<option value="">Todos</option>'+options(uniq(r=>r.source_assunto));$('fBanca').innerHTML='<option value="">Todas</option>'+options(uniq(r=>r.source_banca));$('fYear').innerHTML='<option value="">Todos</option>'+options(uniq(r=>r.source_year));$('fType').innerHTML='<option value="">Todos</option>'+options(uniq(typeLabel))}
function counters(){$('cTotal').textContent=rows.length;$('cAderente').textContent=rows.filter(r=>r.adherence==='ADERENTE').length;$('cRevisar').textContent=rows.filter(r=>r.adherence==='REVISAR').length;$('cNao').textContent=rows.filter(r=>r.adherence==='NAO_ADERENTE').length;$('cQualidade').textContent=rows.filter(r=>r.editorial_quality==='PENDENTE').length;$('cManual').textContent=rows.filter(r=>r.classification_method==='manual').length}
function applyFilters(){const q=$('fText').value.trim().toLowerCase();filtered=rows.filter(r=>(!$('fStatus').value||r.adherence===$('fStatus').value)&&(!$('fTopic').value||r.syllabus_topic===$('fTopic').value)&&(!$('fAssunto').value||r.source_assunto===$('fAssunto').value)&&(!$('fBanca').value||r.source_banca===$('fBanca').value)&&(!$('fYear').value||String(r.source_year)===$('fYear').value)&&(!$('fType').value||typeLabel(r)===$('fType').value)&&(!$('fQuality').value||r.editorial_quality===$('fQuality').value)&&(!q||String(r.statement||'').toLowerCase().includes(q)));page=1;render()}
function topicOptions(selected){return '<option value="">Sem tópico</option>'+TOPICS.map(x=>'<option '+(x===selected?'selected':'')+'>'+esc(x)+'</option>').join('')}
function renderCard(r,index){const p=payload(r),alts=alternatives(r.alternatives),tb=textBase(r),fv=figureValue(r),fu=safeFigure(fv),prefix='q'+index;
return '<article class="question" data-id="'+r.question_id+'"><div class="question-head"><div><div class="badges">'+badge(r.adherence)+badge(r.editorial_quality)+'<span class="badge">'+esc(typeLabel(r))+'</span>'+(r.classification_method==='manual'?'<span class="badge ok">Manual</span>':'<span class="badge">Automática</span>')+'</div><div class="muted" style="margin-top:8px">Ref. '+esc(val(r.source_reference))+'</div></div><span class="muted">'+esc(index+1)+' / '+rows.length+'</span></div>'+
(!r.decisions_consistent?'<div class="notice">Atenção: os 18 registros não estão consistentes. A linha exibida prioriza uma revisão manual.</div>':'')+
'<div class="statement">'+esc(r.statement)+'</div>'+
(tb?'<h4>Texto-base</h4><div class="source-text">'+esc(tb)+'</div>':'')+
(fu?'<h4>Figura</h4><img class="figure" src="'+esc(fu)+'" alt="Figura da questão" loading="lazy">':fv?'<h4>Figura</h4><div class="source-text">'+esc(typeof fv==='string'?fv:JSON.stringify(fv))+'</div>':'')+
(alts.length?'<h4>Alternativas</h4><div class="alternatives">'+alts.map(a=>'<div class="alternative"><b>'+esc(a.k)+')</b> '+esc(a.t)+'</div>').join('')+'</div>':'<div class="muted">Questão certo/errado: sem alternativas A–E.</div>')+
'<p class="answer">Gabarito: '+esc(val(r.answer??p.gabarito))+'</p>'+
(r.explanation||p.comentario?'<h4>Explicação / comentário</h4><div class="explanation">'+esc(r.explanation||p.comentario)+'</div>':'')+
'<div class="meta"><div><b>Tipo</b>'+esc(typeLabel(r))+'</div><div><b>Banca</b>'+esc(val(r.source_banca))+'</div><div><b>Órgão</b>'+esc(val(r.source_orgao))+'</div><div><b>Cargo de origem</b>'+esc(val(r.source_cargo))+'</div><div><b>Ano</b>'+esc(val(r.source_year))+'</div><div><b>Matéria</b>'+esc(val(r.source_materia))+'</div><div><b>Assunto QAPI</b>'+esc(val(r.source_assunto))+'</div><div><b>Dificuldade QAPI (referência)</b>'+esc(val(r.qapi_difficulty))+'</div><div><b>Tópico proposto</b>'+esc(val(r.syllabus_topic))+'</div><div><b>Revisões no escopo</b>'+esc(r.preparation_review_count)+'/18</div></div>'+
'<div class="editor"><h3>Decisão editorial</h3><div class="quick"><button class="btn" onclick="setAdherence(\''+r.question_id+'\',\'ADERENTE\')">Aprovar como aderente</button><button class="btn secondary" onclick="setAdherence(\''+r.question_id+'\',\'REVISAR\')">Marcar para revisar</button><button class="btn danger" onclick="setAdherence(\''+r.question_id+'\',\'NAO_ADERENTE\')">Não aderente</button></div><div class="form-grid">'+
'<div><label>Status</label><select id="'+prefix+'-adherence"><option '+(r.adherence==='ADERENTE'?'selected':'')+'>ADERENTE</option><option '+(r.adherence==='REVISAR'?'selected':'')+'>REVISAR</option><option '+(r.adherence==='NAO_ADERENTE'?'selected':'')+'>NAO_ADERENTE</option></select></div>'+
'<div class="span2"><label>Tópico oficial</label><select id="'+prefix+'-topic">'+topicOptions(r.syllabus_topic)+'</select></div>'+
'<div><label>Qualidade editorial</label><select id="'+prefix+'-quality"><option '+(r.editorial_quality==='PENDENTE'?'selected':'')+'>PENDENTE</option><option '+(r.editorial_quality==='APROVADA'?'selected':'')+'>APROVADA</option><option '+(r.editorial_quality==='REVISAR'?'selected':'')+'>REVISAR</option><option '+(r.editorial_quality==='REPROVADA'?'selected':'')+'>REPROVADA</option></select></div>'+
'<div class="span2"><label>Subassunto</label><input id="'+prefix+'-subtopic" value="'+esc(r.subtopic||'')+'" maxlength="240"></div>'+
'<div><label>Dificuldade editorial (opcional)</label><select id="'+prefix+'-difficulty"><option value="">Não definida</option><option value="facil" '+(r.editorial_difficulty==='facil'?'selected':'')+'>Fácil</option><option value="media" '+(r.editorial_difficulty==='media'?'selected':'')+'>Média</option><option value="dificil" '+(r.editorial_difficulty==='dificil'?'selected':'')+'>Difícil</option></select></div>'+
'<div class="span2"><label>Observação / motivo</label><textarea id="'+prefix+'-reason" maxlength="4000">'+esc(r.classification_reason||'')+'</textarea></div></div>'+
(r.manual_review_count>0?'<div class="notice">Esta questão já possui '+r.manual_review_count+' revisão(ões) manual(is). Uma nova aplicação exigirá confirmação específica.</div>':'')+
'<button id="'+prefix+'-save" class="btn" style="margin-top:13px" onclick="saveDecision(\''+r.question_id+'\','+index+')">Aplicar esta decisão aos 18 cargos Transpetro NM 2026.3</button></div></article>'}
function render(){const max=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));if(page>max)page=max;const start=(page-1)*PAGE_SIZE,slice=filtered.slice(start,start+PAGE_SIZE);$('list').innerHTML=slice.length?slice.map((r,i)=>renderCard(r,start+i)).join(''):'<div class="panel empty">Nenhuma questão encontrada.</div>';$('resultCount').textContent=filtered.length+' questão(ões) nos filtros';$('pageInfo').textContent='Página '+page+' de '+max;$('prev').disabled=page<=1;$('next').disabled=page>=max}
function setAdherence(id,status){const idx=filtered.findIndex(r=>r.question_id===id),global=idx+(page-1)*0;const card=document.querySelector('[data-id="'+id+'"]');if(card){const s=card.querySelector('select[id$="-adherence"]');if(s)s.value=status}}
async function saveDecision(id,index){if(busy)return;const r=rows.find(x=>x.question_id===id),prefix='q'+index;const body={p_question_id:id,p_syllabus_topic:$(prefix+'-topic').value||null,p_subtopic:$(prefix+'-subtopic').value.trim()||null,p_adherence:$(prefix+'-adherence').value,p_editorial_quality:$(prefix+'-quality').value,p_editorial_difficulty:$(prefix+'-difficulty').value||null,p_classification_reason:$(prefix+'-reason').value.trim(),p_confirm_overwrite_manual:false};if(body.p_adherence==='ADERENTE'&&!body.p_syllabus_topic){alert('Selecione o tópico oficial para uma questão aderente.');return}if(!body.p_classification_reason){alert('Informe a observação/motivo.');return}if(!confirm('Confirmar esta decisão para os 18 cargos Transpetro NM 2026.3?\n\nSomente question_preparation_editorial_reviews será atualizada.'))return;if(r.manual_review_count>0){if(!confirm('ATENÇÃO: já existe revisão manual para esta questão. Deseja substituir explicitamente a decisão manual nos 18 cargos?'))return;body.p_confirm_overwrite_manual=true}busy=true;const button=$(prefix+'-save');button.disabled=true;$('message').innerHTML='<div class="panel muted">Salvando decisão atômica nos 18 registros…</div>';try{const{data,error}=await sb.rpc('apply_transpetro_portuguese_editorial_review',body);if(error)throw error;const result=data?.[0];if(Number(result?.updated_count)!==18)throw new Error('A função não confirmou 18 atualizações.');$('message').innerHTML='<div class="success">Decisão manual aplicada atomicamente aos 18 cargos. Nenhuma questão foi liberada.</div>';await load()}catch(e){$('message').innerHTML='<div class="error">Falha: '+esc(e.message)+'</div>';button.disabled=false}finally{busy=false}}
async function load(){const{data,error}=await sb.rpc('admin_transpetro_portuguese_editorial_reviews');if(error)throw error;rows=data||[];setSelects();counters();applyFilters()}
async function init(){const{data,error}=await sb.auth.getSession();if(error||!data.session)throw new Error(error?.message||'Sessão não encontrada.');const{data:isAdmin,error:ae}=await sb.rpc('is_admin');if(ae||isAdmin!==true)throw new Error(ae?.message||'Acesso restrito a administradores.');$('auth').innerHTML='<span class="success">Administrador autenticado. A tela não cria applicability nem altera questões.</span>';$('app').classList.remove('hidden');await load()}
['fStatus','fTopic','fAssunto','fBanca','fYear','fType','fQuality'].forEach(id=>$(id).addEventListener('change',applyFilters));$('fText').addEventListener('input',applyFilters);$('clearFilters').onclick=()=>{['fStatus','fTopic','fAssunto','fBanca','fYear','fType','fQuality','fText'].forEach(id=>$(id).value='');applyFilters()};$('prev').onclick=()=>{page--;render();scrollTo({top:0,behavior:'smooth'})};$('next').onclick=()=>{page++;render();scrollTo({top:0,behavior:'smooth'})};
init().catch(e=>{$('auth').innerHTML='<div class="error">'+esc(e.message)+'</div>'});
</script></body></html>
