<style>
:root{--bg:#07100b;--panel:#0b1710;--panel2:#0f2117;--line:#203b2a;--text:#f3f7f4;--muted:#83978a;--green:#66e08a;--green2:#b9ffca;--red:#ff667a;--amber:#f0c96b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#07100b;color:var(--text)}
body{background:radial-gradient(circle at 50% -20%,#17482b 0,transparent 34%),#07100b}
a{color:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}
header{height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:26px;font-weight:950;letter-spacing:-1px}.brand b{color:var(--green)}
.top{display:flex;align-items:center;gap:8px}.pill,.lang,.admin-link{border:1px solid var(--line);background:#0b1a12;color:#cfe0d3;border-radius:999px;padding:8px 10px;text-decoration:none;font-size:10px;font-weight:900}.admin-link{background:var(--green);color:#07100b}
.hero{padding:28px 0 18px}.hero h1{font-size:clamp(32px,5vw,58px);letter-spacing:-2.5px;line-height:1;margin:0 0 10px}.hero h1 span{color:var(--green)}.hero p{margin:0;color:#93a79a;font-size:14px;line-height:1.55}
.board{display:grid;grid-template-columns:230px 1fr;gap:14px;padding-bottom:60px}
.sidebar,.mainbox{border:1px solid var(--line);background:#08140d;border-radius:18px;overflow:hidden}.sidebar{height:max-content;position:sticky;top:12px}
.side-title{padding:14px 15px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#758a7c;border-bottom:1px solid var(--line);font-weight:900}.side-btn{width:100%;border:0;border-bottom:1px solid #172c20;background:transparent;color:#b7c7bc;text-align:left;padding:12px 15px;cursor:pointer;font-size:12px}.side-btn:hover,.side-btn.active{background:#102419;color:#fff}.side-btn b{float:right;color:#789084}
.datebar{padding:12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;overflow:auto;background:#0a1710;scrollbar-width:none}.datebar::-webkit-scrollbar{display:none}
.day{min-width:88px;border:1px solid #1d3928;background:#0a1710;color:#9db0a2;border-radius:12px;padding:9px 8px;text-align:center;cursor:pointer}.day strong{display:block;color:#dce8df;font-size:11px}.day span{display:block;font-size:9px;margin-top:3px}.day.active{background:#163724;border-color:#4da96b}.day.active strong{color:#fff}.navday{min-width:36px;height:42px;border:1px solid #1d3928;background:#0a1710;color:#c6d4ca;border-radius:11px;cursor:pointer}
.toolbar{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line);align-items:center}.filter{border:1px solid #1e3a29;background:#0a1710;color:#aebfb3;padding:8px 11px;border-radius:999px;font-size:10px;font-weight:900;cursor:pointer}.filter.active{background:var(--green);border-color:var(--green);color:#06100b}.count{margin-left:auto;font-size:10px;color:#72867a}
.loading,.empty,.error{padding:46px 20px;text-align:center;color:#829487}.error{color:#ff9aa6}.spinner{width:28px;height:28px;border:3px solid #20402d;border-top-color:var(--green);border-radius:50%;margin:0 auto 10px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.league{border-top:1px solid #1b3324}.league:first-child{border-top:0}.league-head{display:flex;align-items:center;gap:9px;padding:11px 14px;background:#0c1a12;position:sticky;top:0}.league-head img{width:20px;height:20px;object-fit:contain}.league-head .country{font-size:9px;color:#718778;text-transform:uppercase;font-weight:900}.league-head .name{font-size:12px;font-weight:900}.league-head .games-count{margin-left:auto;color:#6f8576;font-size:9px}
.game{display:grid;grid-template-columns:64px 1fr 58px;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid #15291d;cursor:pointer;transition:.15s}.game:hover{background:#0d1f15}.time{text-align:center;font-size:11px;color:#93a799}.time.live{color:#ff7e8d;font-weight:950}.teams{display:grid;gap:7px}.team{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}.team img{width:20px;height:20px;object-fit:contain}.team.winner{font-weight:950;color:#fff}.score{text-align:center;font-size:16px;font-weight:950}.score small{display:block;font-size:8px;color:#6f8275;font-weight:800;margin-top:3px}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff667a;margin-right:4px;box-shadow:0 0 10px #ff667a}
.source{padding:10px 14px;border-top:1px solid var(--line);font-size:9px;color:#607467}.source b{color:#7f9686}
@media(max-width:820px){header{height:62px}.pill{display:none}.board{grid-template-columns:1fr}.sidebar{position:static;display:none}.hero{padding:18px 0 14px}.hero h1{font-size:38px}.game{grid-template-columns:54px 1fr 48px;padding:10px}.team{font-size:11px}.datebar{padding:9px}.day{min-width:78px}.mainbox{border-radius:14px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/visitor-tracker.js"></script><script defer src="/admin-access.js"></script></head>
<body><div class="wrap"><header><div class="brand">Nós <b>Passa</b></div><div class="top"><span class="pill">⚽ SCORES</span><a class="lang" href="/">PT</a><a class="lang" href="/en/">EN</a><a class="lang" href="/es/">ES</a><a class="admin-link" href="/trafego.html" data-admin-only hidden>Login</a></div></header>
<section class="hero"><h1>Every match. <span>Every day.</span></h1><p>Browse the date and follow football fixtures, competitions, kick-off times and scores from around the world.</p></section>
<div class="board"><aside class="sidebar"><div class="side-title" id="side-title">Competitions</div><div id="side"></div></aside>
<main class="mainbox"><div class="datebar" id="datebar"></div><div class="toolbar"><button class="filter active" id="filter-all" data-filter="all"></button><button class="filter" id="filter-live" data-filter="live"></button><button class="filter" id="filter-finished" data-filter="finished"></button><button class="filter" id="filter-scheduled" data-filter="scheduled"></button><span class="count" id="count"></span></div><div id="games"></div><div class="source" id="source"></div></main></div></div><script>
(function(){
const API='https://ztqtcbzjesrkuaijmylm.supabase.co/functions/v1/football-fixtures';
const lang=(document.documentElement.lang||'pt-BR').toLowerCase();
const tr=lang.startsWith('en')?{
 today:'Today',yesterday:'Yesterday',tomorrow:'Tomorrow',all:'All',live:'Live',finished:'Finished',scheduled:'Scheduled',games:'games',noGames:'No matches found for this date.',loading:'Loading matches...',error:'Could not load matches.',direct:'Football data automatically updated',comp:'Competitions'
}:lang.startsWith('es')?{
 today:'Hoy',yesterday:'Ayer',tomorrow:'Mañana',all:'Todos',live:'En vivo',finished:'Finalizados',scheduled:'Programados',games:'partidos',noGames:'No hay partidos para esta fecha.',loading:'Cargando partidos...',error:'No fue posible cargar los partidos.',direct:'Datos de fútbol actualizados automáticamente',comp:'Competiciones'
}:{
 today:'Hoje',yesterday:'Ontem',tomorrow:'Amanhã',all:'Todos',live:'Ao vivo',finished:'Encerrados',scheduled:'Programados',games:'jogos',noGames:'Nenhum jogo encontrado nesta data.',loading:'Carregando jogos...',error:'Não foi possível carregar os jogos.',direct:'Dados de futebol atualizados automaticamente',comp:'Competições'
};

const $=id=>document.getElementById(id);
const state={date:localISO(new Date()),filter:'all',data:null};

function localISO(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),o=Object.fromEntries(p.map(x=>[x.type,x.value]));return o.year+'-'+o.month+'-'+o.day}
function addDays(iso,n){const [y,m,d]=iso.split('-').map(Number),x=new Date(Date.UTC(y,m-1,d+n,12));return x.toISOString().slice(0,10)}
function relLabel(iso){const today=localISO(new Date());if(iso===today)return tr.today;if(iso===addDays(today,-1))return tr.yesterday;if(iso===addDays(today,1))return tr.tomorrow;return new Intl.DateTimeFormat(lang,{weekday:'short',timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z')).replace('.','')}
function dayNum(iso){return new Intl.DateTimeFormat(lang,{day:'2-digit',month:'2-digit',timeZone:'UTC'}).format(new Date(iso+'T12:00:00Z'))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function statusType(s){const live=['1H','HT','2H','ET','BT','P','SUSP','INT','LIVE'];const fin=['FT','AET','PEN'];if(live.includes(s))return'live';if(fin.includes(s))return'finished';return'scheduled'}
function displayTime(f){const st=f.status?.short;if(statusType(st)==='live')return '<span class="live-dot"></span>'+esc((f.status.elapsed??'')+"'");if(statusType(st)==='finished')return esc(st);try{return new Intl.DateTimeFormat(lang,{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Sao_Paulo'}).format(new Date(f.date))}catch{return'—'}}
function renderDates(){const box=$('datebar');let html='<button class="navday" data-shift="-1">‹</button>';for(let i=-2;i<=3;i++){const d=addDays(state.date,i);html+='<button class="day '+(i===0?'active':'')+'" data-date="'+d+'"><strong>'+esc(relLabel(d))+'</strong><span>'+esc(dayNum(d))+'</span></button>'}html+='<button class="navday" data-shift="1">›</button>';box.innerHTML=html;box.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.date=b.dataset.date;load()});box.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{state.date=addDays(state.date,Number(b.dataset.shift));load()})}
function filteredFixtures(){const a=state.data?.fixtures||[];if(state.filter==='all')return a;return a.filter(f=>statusType(f.status?.short)===state.filter)}
function group(fixtures){const m=new Map();fixtures.forEach(f=>{const k=(f.league?.country||'World')+'|'+(f.league?.id||0)+'|'+(f.league?.name||'Other');if(!m.has(k))m.set(k,{league:f.league,games:[]});m.get(k).games.push(f)});return [...m.values()].sort((a,b)=>(a.league.country||'').localeCompare(b.league.country||'')||(a.league.name||'').localeCompare(b.league.name||''))}
function renderSide(groups){$('side-title').textContent=tr.comp;$('side').innerHTML='<button class="side-btn active" data-league="all">'+tr.all+' <b>'+filteredFixtures().length+'</b></button>'+groups.map((g,i)=>'<button class="side-btn" data-league="'+i+'">'+esc(g.league.name)+' <b>'+g.games.length+'</b></button>').join('');$('side').querySelectorAll('[data-league]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.side-btn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(btn.dataset.league==='all'){renderGames(groups)}else{renderGames([groups[Number(btn.dataset.league)]])}})
function gameHTML(f){const typ=statusType(f.status?.short),homeWin=f.teams?.home?.winner===true,awayWin=f.teams?.away?.winner===true;const score=(typ==='scheduled'||(f.goals?.home==null&&f.goals?.away==null))?'<span>–</span>':'<span>'+esc(f.goals?.home??0)+'</span><span>'+esc(f.goals?.away??0)+'</span>';return '<div class="game" data-id="'+esc(f.id)+'"><div class="time '+(typ==='live'?'live':'')+'">'+displayTime(f)+'</div><div class="teams"><div class="team '+(homeWin?'winner':'')+'"><img src="'+esc(f.teams.home.logo)+'" loading="lazy" alt=""><span>'+esc(f.teams.home.name)+'</span></div><div class="team '+(awayWin?'winner':'')+'"><img src="'+esc(f.teams.away.logo)+'" loading="lazy" alt=""><span>'+esc(f.teams.away.name)+'</span></div></div><div class="score">'+score+'<small>'+esc(f.status?.short||'')+'</small></div></div>'}
function renderGames(groups){const box=$('games');if(!groups.length){box.innerHTML='<div class="empty">'+tr.noGames+'</div>';return}box.innerHTML=groups.map(g=>'<section class="league"><div class="league-head">'+(g.league.flag?'<img src="'+esc(g.league.flag)+'" alt="">':'')+'<div><div class="country">'+esc(g.league.country||'World')+'</div><div class="name">'+esc(g.league.name)+'</div></div><div class="games-count">'+g.games.length+' '+tr.games+'</div></div>'+g.games.map(gameHTML).join('')+'</section>').join('')}
function rerender(){const fs=filteredFixtures();const groups=group(fs);$('count').textContent=fs.length+' '+tr.games;renderSide(groups);renderGames(groups)}
async function load(){renderDates();$('games').innerHTML='<div class="loading"><div class="spinner"></div>'+tr.loading+'</div>';$('count').textContent='';try{const r=await fetch(API+'?date='+encodeURIComponent(state.date));const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'HTTP '+r.status);state.data=d;rerender();$('source').innerHTML='<b>'+tr.direct+'</b> • '+esc(state.date)+(d.cached?' • cache':'')}catch(e){$('games').innerHTML='<div class="error">'+tr.error+'</div>';console.error(e)}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;rerender()});
$('filter-all').textContent=tr.all;$('filter-live').textContent=tr.live;$('filter-finished').textContent=tr.finished;$('filter-scheduled').textContent=tr.scheduled;
load();setInterval(()=>{if(state.date===localISO(new Date()))load()},300000);
})();
</script></body></html>
