<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AprovaAI</title>
<script src="https://cdn.jsdelivr.net/npm/brazil-map/dist/brazil-map.umd.min.js"></script>
</head>
<body>
<!-- Existing page content preserved by the project. -->
<brazil-component id="brazilMap"></brazil-component>
<script>
(function(){
  const map=document.getElementById('brazilMap');
  const names={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
  let lastUF='',lastAt=0;
  function handleState(uf){
    uf=String(uf||'').toUpperCase().trim();
    if(!names[uf])return;
    const now=Date.now();
    if(uf===lastUF&&now-lastAt<500)return;
    lastUF=uf;lastAt=now;
    const target=uf==='RJ'?'transpetro-landing.html?uf=RJ&marica=1':'transpetro-landing.html?uf='+encodeURIComponent(uf);
    window.location.href=target;
  }
  map.addEventListener('onStateSelected',e=>handleState(e.detail));
  function bindFallback(){
    const root=map.shadowRoot;
    if(!root)return;
    root.addEventListener('click',e=>{
      const path=e.composedPath().find(el=>el&&el.tagName&&el.tagName.toLowerCase()==='path');
      if(!path)return;
      const raw=path.id||path.getAttribute('data-id')||path.getAttribute('data-state')||'';
      const m=String(raw).toUpperCase().match(/(?:BR[-_])?([A-Z]{2})$/);
      if(m&&names[m[1]])handleState(m[1]);
    },true);
  }
  if(window.customElements&&customElements.whenDefined){customElements.whenDefined('brazil-component').then(bindFallback);}else setTimeout(bindFallback,1000);
})();
</script>
</body>
</html>
