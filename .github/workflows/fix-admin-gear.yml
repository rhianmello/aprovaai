name: Restore admin gear

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visitor tracker
        shell: python
        run: |
          from pathlib import Path
          p = Path('visitor-tracker.js')
          text = p.read_text(encoding='utf-8')
          if 'id="np-admin-gear"' in text or 'function adminNav(' in text:
              print('Admin gear already present')
              raise SystemExit(0)
          marker = 'function init(){'
          if marker not in text:
              raise SystemExit('visitor-tracker.js: init marker not found')
          fn = r'''async function adminNav(){
try{
 const sb=await getClient();
 const {data:{session}}=await sb.auth.getSession();
 const apply=async logged=>{
   const old=document.getElementById('np-admin-gear');
   if(old)old.remove();
   if(!logged)return;
   try{
     const {data:admin,error}=await sb.rpc('is_admin');
     if(error||admin!==true)return;
     const host=document.querySelector('header .account')||document.querySelector('header')||document.querySelector('.nav-actions');
     if(!host)return;
     const a=document.createElement('a');
     a.id='np-admin-gear';
     a.href='admin.html';
     a.title='Administração';
     a.setAttribute('aria-label','Abrir administração');
     a.textContent='⚙️ ADM';
     a.style.cssText='display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 12px;border-radius:9px;border:1px solid #4a4120;background:#17140b;color:#f2d86b;text-decoration:none;font-weight:800;font-size:13px;white-space:nowrap;';
     host.appendChild(a);
   }catch(e){console.warn('[AdminNav]',e)}
 };
 await apply(!!session);
 sb.auth.onAuthStateChange((_event,next)=>{apply(!!next)});
}catch(e){console.warn('[AdminNav]',e)}
}
'''
          text = text.replace(marker, fn + marker, 1)
          text = text.replace('init();', 'init();adminNav();', 1)
          p.write_text(text, encoding='utf-8')
          print('Admin gear restored')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitor-tracker.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore admin gear for admin users"
          git push
