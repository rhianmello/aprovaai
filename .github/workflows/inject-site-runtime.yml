name: Inject site runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize visitor tracker on HTML pages
        shell: python
        run: |
          from pathlib import Path
          import os, re

          root = Path('.')
          changed = []
          tracker = 'visitor-tracker.js'
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'

          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              rel = os.path.relpath(tracker, p.parent).replace(os.sep, '/')
              tag = f'<script src="{rel}"></script>'
              new = re.sub(r'<script\s+src=["\'][^"\']*visitor-tracker\.js[^"\']*["\']\s*></script>', '', text, flags=re.I)
              low = new.lower()
              marker = '</head>'
              if marker in low:
                  i = low.rfind(marker)
                  new = new[:i] + tag + new[i:]
              elif '</body>' in low:
                  i = low.rfind('</body>')
                  new = new[:i] + tag + new[i:]

              if p.as_posix() == 'simulados-gratis.html' and supabase_tag not in new:
                  low = new.lower()
                  i = low.rfind('</head>')
                  if i >= 0:
                      new = new[:i] + supabase_tag + new[i:]

              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          print(f'Normalized {len(changed)} HTML pages')
          for x in changed:
              print(x)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add -A
          git commit -m "chore: normalize site-wide visitor tracker"
          git push
