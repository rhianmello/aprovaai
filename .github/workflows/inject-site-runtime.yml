name: Inject site runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize site runtime
        shell: python
        run: |
          from pathlib import Path
          import os, re

          root = Path('.')
          changed = []
          tracker = 'visitor-tracker.js'
          test_ui = 'simulados-gratis-ui.js'
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'

          # Keep the custom domain as the single public canonical host.
          old_base = 'https://rhianmello.github.io/aprovaai'
          new_base = 'https://www.nospassa.com.br'
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.json', '.xml', '.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace(old_base, new_base)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          # The database currently uses the public slug "transpetro" for SAP.
          legacy_sap_slug = 'transpetro-2026-analise-de-sistemas-sap'
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.json', '.xml', '.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace(legacy_sap_slug, 'transpetro')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          # Current official Transpetro schedule: objective exams on 06/12/2026.
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.suffix.lower() not in {'.html', '.js', '.json', '.xml', '.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace('29/11/2026', '06/12/2026')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              rel_tracker = os.path.relpath(tracker, p.parent).replace(os.sep, '/')
              tracker_tag = f'<script src="{rel_tracker}"></script>'
              new = re.sub(r'<script\s+src=["\'][^"\']*visitor-tracker\.js[^"\']*["\']\s*></script>', '', text, flags=re.I)

              # The admin panel must not load visitor analytics.
              if p.as_posix() != 'admin-v3.html':
                  low = new.lower()
                  marker = '</head>'
                  if marker in low:
                      i = low.rfind(marker)
                      new = new[:i] + tracker_tag + new[i:]
                  elif '</body>' in low:
                      i = low.rfind('</body>')
                      new = new[:i] + tracker_tag + new[i:]

              if p.as_posix() == 'simulados-gratis.html':
                  if supabase_tag not in new:
                      low = new.lower(); i = low.rfind('</head>')
                      if i >= 0: new = new[:i] + supabase_tag + new[i:]
                  rel_ui = os.path.relpath(test_ui, p.parent).replace(os.sep, '/')
                  ui_tag = f'<script src="{rel_ui}"></script>'
                  new = re.sub(r'<script\s+src=["\'][^"\']*simulados-gratis-ui\.js[^"\']*["\']\s*></script>', '', new, flags=re.I)
                  low = new.lower(); i = low.rfind('</body>')
                  if i >= 0: new = new[:i] + ui_tag + new[i:]

              if p.as_posix() == 'admin-v3.html':
                  # Force the browser to pick up the current admin-modern.js build.
                  new = re.sub(r'admin-modern\.js(?:\?v=[^"\']*)?', 'admin-modern.js?v=20260910-4', new, flags=re.I)
                  marker = '<section id="payments"'
                  if 'admin-import-questions-link' not in new and marker in new:
                      link = '<div id="admin-import-questions-link" style="margin:14px 0;padding:14px 16px;background:#11161c;border:1px solid #2a3440;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><strong style="font-size:15px">📝 Banco de questões</strong><div style="color:#99a4b0;font-size:12px;margin-top:4px">Importe lotes JSON com validação e dry-run.</div></div><a href="admin/importar-questoes.html" style="display:inline-block;padding:9px 13px;border-radius:9px;background:#e4c64a;color:#111;font-weight:900;text-decoration:none">Importar questões</a></div>'
                      new = new.replace(marker, link + marker, 1)

              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          p = root / 'study-dashboard-stable-v2.js'
          if p.exists():
              text = p.read_text(encoding='utf-8')
              new = text.replace('📅 Plano de estudo', '📋 Plano de estudo').replace('📅 Questões de hoje', '📝 Questões de hoje')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          # Remove as decorações dos cards de planos.
          p = root / 'visitor-tracker.js'
          if p.exists():
              text = p.read_text(encoding='utf-8')
              new = text
              new = re.sub(r'\.np-price-deco\{.*?\}\.np-price-deco\.left\{.*?\}\.np-price-deco\.right\{.*?\}\.np-price-deco\.top\{.*?\}\.np-price-deco \.np-deco-icon\{.*?\}\.np-price-deco \.np-deco-text\{.*?\}\.np-price-deco \.np-arrow\{.*?\}\.np-price-deco\.top \.np-deco-icon\{.*?\}\.np-price-deco\.top \.np-deco-text\{.*?\}', '', new, count=1, flags=re.S)
              new = new.replace('@media(max-width:1050px){#np-pricing .np-price-deco{display:none}}', '', 1)
              new = re.sub(r'<div class="np-price-deco top">.*?</div><div class="np-price-deco left">.*?</div><div class="np-price-deco right">.*?</div>', '', new, count=1, flags=re.S)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append('visitor-tracker.js')

          print(f'Normalized {len(set(changed))} files')
          for x in sorted(set(changed)): print(x)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add -A
          git commit -m "chore: normalize site URLs, slugs and schedule"
          git push
