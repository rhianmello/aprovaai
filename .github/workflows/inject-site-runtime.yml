name: Inject site runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize site runtime
        shell: python
        run: |
          from pathlib import Path
          import os, re

          root = Path('.')
          changed = []
          tracker = 'visitor-tracker.js'
          test_ui = 'simulados-gratis-ui.js'
          supabase_tag = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'

          for p in root.rglob('*.html'):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8')
              rel_tracker = os.path.relpath(tracker, p.parent).replace(os.sep, '/')
              tracker_tag = f'<script src="{rel_tracker}"></script>'
              new = re.sub(r'<script\s+src=["\'][^"\']*visitor-tracker\.js[^"\']*["\']\s*></script>', '', text, flags=re.I)
              low = new.lower()
              marker = '</head>'
              if marker in low:
                  i = low.rfind(marker)
                  new = new[:i] + tracker_tag + new[i:]
              elif '</body>' in low:
                  i = low.rfind('</body>')
                  new = new[:i] + tracker_tag + new[i:]

              if p.as_posix() == 'simulados-gratis.html':
                  if supabase_tag not in new:
                      low = new.lower(); i = low.rfind('</head>')
                      if i >= 0: new = new[:i] + supabase_tag + new[i:]
                  rel_ui = os.path.relpath(test_ui, p.parent).replace(os.sep, '/')
                  ui_tag = f'<script src="{rel_ui}"></script>'
                  new = re.sub(r'<script\s+src=["\'][^"\']*simulados-gratis-ui\.js[^"\']*["\']\s*></script>', '', new, flags=re.I)
                  low = new.lower(); i = low.rfind('</body>')
                  if i >= 0: new = new[:i] + ui_tag + new[i:]

              if p.as_posix() == 'admin-v3.html':
                  marker = '<section id="payments"'
                  if 'admin-import-questions-link' not in new and marker in new:
                      link = '<div id="admin-import-questions-link" style="margin:14px 0;padding:14px 16px;background:#11161c;border:1px solid #2a3440;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><strong style="font-size:15px">📝 Banco de questões</strong><div style="color:#99a4b0;font-size:12px;margin-top:4px">Importe lotes JSON com validação e dry-run.</div></div><a href="admin/importar-questoes.html" style="display:inline-block;padding:9px 13px;border-radius:9px;background:#e4c64a;color:#111;font-weight:900;text-decoration:none">Importar questões</a></div>'
                      new = new.replace(marker, link + marker, 1)

              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          p = root / 'study-dashboard-stable-v2.js'
          if p.exists():
              text = p.read_text(encoding='utf-8')
              new = text.replace('📅 Plano de estudo', '📋 Plano de estudo').replace('📅 Questões de hoje', '📝 Questões de hoje')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(p.as_posix())

          # Melhora visual da seção de planos da página principal.
          p = root / 'visitor-tracker.js'
          if p.exists():
              text = p.read_text(encoding='utf-8')
              if '.np-price-deco' not in text:
                  css_old = '#np-pricing .np-price-grid{'
                  css_new = '.np-price-deco{position:absolute;z-index:2;pointer-events:none;text-align:center;font-weight:900;line-height:1.35}.np-price-deco.left{left:5px;top:18px;width:78px;color:#62c3ed}.np-price-deco.right{right:5px;top:20px;width:82px;color:#e4c64a}.np-price-deco.top{right:8px;top:-4px;width:105px;color:#e4c64a}.np-price-deco .np-deco-icon{display:block;font-size:48px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}.np-price-deco .np-deco-text{font-size:11px;font-style:italic;letter-spacing:.2px}.np-price-deco .np-arrow{display:block;font-size:26px;margin-top:6px}.np-price-deco.top .np-deco-icon{font-size:28px}.np-price-deco.top .np-deco-text{font-size:10px}#np-pricing .np-price-grid{'
                  if css_old not in text:
                      raise SystemExit('pricing CSS marker not found')
                  text = text.replace(css_old, css_new, 1)
                  text = text.replace('@media(max-width:900px){', '@media(max-width:1050px){#np-pricing .np-price-deco{display:none}}@media(max-width:900px){', 1)
                  html_old = '<div class="wrap"><div class="np-price-grid">'
                  html_new = '<div class="wrap"><div class="np-price-deco top"><span class="np-deco-icon">↗</span><span class="np-deco-text">Acompanhe seu progresso e evolua!</span></div><div class="np-price-deco left"><span class="np-deco-icon">🎓</span><span class="np-deco-text">Seu futuro começa aqui!</span><span class="np-arrow">↘</span></div><div class="np-price-deco right"><span class="np-deco-icon">🏆</span><span class="np-deco-text">Disciplina hoje.<br>Aprovação amanhã!</span><span class="np-arrow">↙</span></div><div class="np-price-grid">'
                  if html_old not in text:
                      raise SystemExit('pricing HTML marker not found')
                  text = text.replace(html_old, html_new, 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append('visitor-tracker.js')

          print(f'Normalized {len(changed)} files')
          for x in changed: print(x)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add -A
          git commit -m "chore: improve free-test navigation and plan icon"
          git push
