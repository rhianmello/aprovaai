name: Fix admin freeze

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify admin runtime
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin-v3.html')
          s = p.read_text(encoding='utf-8')

          # The admin page must own a single Supabase client. Remove auxiliary
          # runtimes that create competing clients/auth operations on this page.
          s = re.sub(r'<script\\s+src=["\\'](?:visitor-tracker|admin-dashboard)\\.js(?:\\?[^"\\']*)?["\\']\\s*></script>', '', s, flags=re.I)

          # Restore the official Supabase Auth lock implementation instead of
          # overriding it with a no-op lock, which can leave getSession waiting.
          s = s.replace(',lock:async(_name,_acquireTimeout,fn)=>await fn()', '')

          p.write_text(s, encoding='utf-8')
          print('admin-v3.html normalized')

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: stop admin auth freeze'
          git push
