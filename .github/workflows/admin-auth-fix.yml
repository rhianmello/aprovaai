name: Corrigir travamento do ADM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir lock da sessão Supabase no ADM
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-v3.html')
          s=p.read_text(encoding='utf-8')
          old="auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}"
          new="auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false,lock:async(_name,_acquireTimeout,fn)=>await fn()}"
          if old in s and 'lock:async(_name,_acquireTimeout,fn)' not in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('Lock de sessão ajustado')
          else:
              print('Nenhuma alteração necessária')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: evitar travamento do ADM na validação da sessão'
          git push
