name: Ativar dashboard do ADM v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalizar dashboard no ADM
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('admin-v3.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']admin-dashboard\.js(?:\?[^"\']*)?["\']\s*></script>','',s,flags=re.I)
          tag='<script src="admin-dashboard.js?v=20260910-3"></script>'
          s=s.replace('</head>',tag+'</head>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit e publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html
          if git diff --cached --quiet; then echo 'Dashboard já está normalizado'; else git commit -m 'chore: normalize admin dashboard runtime'; git push; fi