name: Adicionar verificação do Google Search Console

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adicionar meta tag do Search Console
        shell: python
        run: |
          from pathlib import Path
          p = Path('concursos.html')
          s = p.read_text(encoding='utf-8')
          tag = '<meta name="google-site-verification" content="uDlbbo_oBcj58x8v5lFbVSetSyzgpmRgCrCoqgNbsLk" />'
          if 'google-site-verification' not in s:
              s = s.replace('<head>', '<head>' + tag, 1)
              p.write_text(s, encoding='utf-8')
              print('Meta tag adicionada em concursos.html')
          else:
              print('Meta tag já existe em concursos.html')

      - name: Remover este workflow após concluir
        shell: bash
        run: rm -f .github/workflows/add-gsc-tag.yml

      - name: Commit da correção
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add concursos.html .github/workflows/add-gsc-tag.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: adicionar verificação do Google Search Console'
          git push
