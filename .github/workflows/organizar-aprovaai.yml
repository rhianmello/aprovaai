name: Organizar AprovaAI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: organizar-aprovaai-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validar estrutura do site
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html',
              'concursos.html',
              'login.html',
              'transpetro-landing.html',
              'transpetro_cargos.html',
              'transpetro.html',
              'inspetor_eletrica.html',
              'INSPETOR_ELETRICA/banco-questoes/inspetor_eletrica_banco.js',
              'INSPETOR_ELETRICA/banco-questoes/inspetor_eletrica_banco_geral.js',
              'INSPETOR_ELETRICA/inspetor_eletrica_expansao.js',
              'INSPETOR_ELETRICA/plano_estudo_detalhado.js',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Arquivos obrigatórios ausentes: ' + ', '.join(missing))

          index = Path('index.html').read_text(encoding='utf-8')
          concursos = Path('concursos.html').read_text(encoding='utf-8')
          cargos = Path('transpetro_cargos.html').read_text(encoding='utf-8')
          landing = Path('transpetro-landing.html').read_text(encoding='utf-8')
          inspector = Path('inspetor_eletrica.html').read_text(encoding='utf-8')

          if 'supabase-js@2' not in index:
              raise SystemExit('index.html não carrega o cliente Supabase')
          if 'brazil-map' not in index:
              raise SystemExit('index.html não carrega o mapa do Brasil')
          if 'concursos.html' not in index:
              raise SystemExit('index.html não possui navegação para concursos.html')
          if 'login.html' not in concursos:
              raise SystemExit('concursos.html não possui entrada de autenticação')
          if 'transpetro-landing.html' not in concursos:
              raise SystemExit('concursos.html não aponta para a landing da Transpetro')
          if 'transpetro.html' not in cargos:
              raise SystemExit('transpetro_cargos.html não possui a trilha SAP')
          if 'inspetor_eletrica.html' not in cargos:
              raise SystemExit('transpetro_cargos.html não possui a trilha Inspetor de Elétrica')

          # A landing da Transpetro agora é um catálogo de cargos.
          # A compra ocorre na preparação específica de cada cargo, portanto
          # não exigimos mais um CTA de checkout diretamente nesta página.
          catalog_markers = [
              'Carregando cargos e preparações',
              'catalog-section',
              'Acessar preparação',
              'supabase.createClient',
          ]
          missing_catalog = [m for m in catalog_markers if m not in landing]
          if missing_catalog:
              raise SystemExit('Catálogo Transpetro incompleto: ' + ', '.join(missing_catalog))

          if 'inspetor_eletrica_expansao.js' not in inspector:
              raise SystemExit('inspetor_eletrica.html não carrega o banco expandido')
          if 'plano_estudo_detalhado.js' not in inspector:
              raise SystemExit('inspetor_eletrica.html não carrega o plano detalhado')

          for p in required[7:9]:
              text = Path(p).read_text(encoding='utf-8')
              if 'INSPETOR_ELETRICA' not in text:
                  raise SystemExit(f'{p} não exporta o banco esperado')

          plano = Path('INSPETOR_ELETRICA/plano_estudo_detalhado.js').read_text(encoding='utf-8')
          if 'window.INSPETOR_PLANO_DETALHADO' not in plano:
              raise SystemExit('Plano detalhado não exporta INSPETOR_PLANO_DETALHADO')

          print('OK: estrutura do Nós Passa validada.')
          PY
