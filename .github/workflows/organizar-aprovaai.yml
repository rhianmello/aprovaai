name: Organizar AprovaAI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: organizar-aprovaai-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Validar estrutura do site
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html',
              'concursos.html',
              'login.html',
              'transpetro-landing.html',
              'transpetro_cargos.html',
              'transpetro.html',
              'inspetor_eletrica.html',
              'INSPETOR_ELETRICA/plano_estudo_detalhado.js',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit('Arquivos obrigatórios ausentes: ' + ', '.join(missing))

          index = Path('index.html').read_text(encoding='utf-8')
          concursos = Path('concursos.html').read_text(encoding='utf-8')
          cargos = Path('transpetro_cargos.html').read_text(encoding='utf-8')
          landing = Path('transpetro-landing.html').read_text(encoding='utf-8')
          inspector = Path('inspetor_eletrica.html').read_text(encoding='utf-8')

          if 'supabase-js@2' not in index:
              raise SystemExit('index.html não carrega o cliente Supabase')
          if 'brazil-map' not in index:
              raise SystemExit('index.html não carrega o mapa do Brasil')
          if 'concursos.html' not in index:
              raise SystemExit('index.html não possui navegação para concursos.html')
          if 'login.html' not in concursos:
              raise SystemExit('concursos.html não possui entrada de autenticação')
          if 'transpetro-landing.html' not in concursos:
              raise SystemExit('concursos.html não aponta para a landing da Transpetro')
          if 'transpetro.html' not in cargos:
              raise SystemExit('transpetro_cargos.html não possui a trilha SAP')
          if 'inspetor_eletrica.html' not in cargos:
              raise SystemExit('transpetro_cargos.html não possui a trilha Inspetor de Elétrica')

          # Valide a interface atual Estado -> Edital -> Cargo e seu contrato.
          from html.parser import HTMLParser
          import re

          class LandingParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.selects = {}
                  self.labels = set()
                  self.ids = set()
                  self.scripts = []
                  self.current_select = None

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
                  if tag == 'label':
                      self.labels.add(attrs.get('for'))
                  if tag == 'select':
                      self.current_select = attrs.get('id')
                      if self.current_select in self.selects:
                          raise SystemExit('Filtro duplicado: ' + self.current_select)
                      self.selects[self.current_select] = {'attrs': attrs, 'values': set()}
                  if tag == 'option' and self.current_select:
                      self.selects[self.current_select]['values'].add(attrs.get('value', ''))
                  if tag == 'script' and attrs.get('src'):
                      self.scripts.append(attrs['src'])

              def handle_endtag(self, tag):
                  if tag == 'select':
                      self.current_select = None

          parsed = LandingParser()
          parsed.feed(landing)
          for control in ('state', 'edital', 'cargo'):
              if control not in parsed.selects or control not in parsed.labels:
                  raise SystemExit('Filtro ou label ausente: ' + control)
              if 'disabled' not in parsed.selects[control]['attrs']:
                  raise SystemExit('Filtro deve aguardar carregamento/seleção: ' + control)
              if not re.search(r"\$\('" + control + r"'\)\.onchange\s*=", landing):
                  raise SystemExit('Filtro sem evento de seleção: ' + control)
          states = set('AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split())
          if not states.issubset(parsed.selects['state']['values']):
              raise SystemExit('Lista de estados incompleta')
          if not {'status', 'selection'}.issubset(parsed.ids):
              raise SystemExit('Regiões de status/resultado ausentes')
          if not any('@supabase/supabase-js@2' in src for src in parsed.scripts):
              raise SystemExit('Landing não carrega o cliente Supabase')
          landing_markers = [
              'supabase.createClient', "sb.from('courses')", ".eq('active',true)",
              'function updateEditais()', 'function updateCargos()', 'function showCourse(',
              "$('state').disabled=false", "$('edital').disabled=false", "$('cargo').disabled=!edital",
              'Carregando preparações', 'Nenhuma preparação Transpetro ativa encontrada.',
              'Não foi possível carregar as preparações agora.', 'if(error)throw error',
              'catch(e)', 'Acessar preparação', 'courseHref(c)', 'curso-landing.html?course=',
              'transpetro-landing-v2.html',
          ]
          missing_landing = [m for m in landing_markers if m not in landing]
          if missing_landing:
              raise SystemExit('Fluxo Transpetro incompleto: ' + ', '.join(missing_landing))

          course_access = Path('course-access.js').read_text(encoding='utf-8')
          if 'load_legacy_course_question_bank' not in course_access:
              raise SystemExit('course-access.js não carrega o banco legado protegido')
          if 'save_legacy_question_attempt' not in course_access or 'clear_legacy_question_errors' not in course_access:
              raise SystemExit('course-access.js não persiste o histórico legado protegido')
          if 'course-access.js' not in inspector:
              raise SystemExit('inspetor_eletrica.html não carrega o controle de acesso protegido')
          if 'plano_estudo_detalhado.js' not in inspector:
              raise SystemExit('inspetor_eletrica.html não carrega o plano detalhado')

          plano = Path('INSPETOR_ELETRICA/plano_estudo_detalhado.js').read_text(encoding='utf-8')
          if 'window.INSPETOR_PLANO_DETALHADO' not in plano:
              raise SystemExit('Plano detalhado não exporta INSPETOR_PLANO_DETALHADO')

          print('OK: estrutura do Nós Passa validada.')
          PY

      - name: Validar carregamento completo do banco
        run: |
          node --check course-access.js
          node scripts/test-student-question-bank.mjs

      - name: Auditar proteção dos bancos legados
        run: node scripts/audit-static-question-banks.mjs

      - name: Validar autorização administrativa
        run: node scripts/test-mission-authorization.mjs
