name: Modernizar ADM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  admin-modern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize admin-modern.js injection
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('admin-v3.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<script\s+src=["\']admin-modern\.js(?:\?[^"\']*)?["\']\s*></script>', '', text, flags=re.I)
          tag = '<script src="admin-modern.js?v=20260910-3"></script>'
          low = text.lower()
          marker = '</head>'
          i = low.rfind(marker)
          if i < 0:
              raise SystemExit('admin-v3.html sem </head>')
          text = text[:i] + tag + text[i:]
          p.write_text(text, encoding='utf-8')
          print('Normalized admin-modern.js injection')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add admin-v3.html
          git commit -m "chore: normalize admin runtime injection"
          git push