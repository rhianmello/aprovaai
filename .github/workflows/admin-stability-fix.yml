name: Corrigir estabilidade do ADM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar clientes Supabase do ADM
        shell: python
        run: |
          from pathlib import Path

          lock = "lock:async(_name,_acquireTimeout,fn)=>await fn()"

          # Analytics e tracker não podem disputar o Navigator Lock da autenticação.
          p = Path('admin-dashboard.js')
          s = p.read_text(encoding='utf-8')
          old = "auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}"
          new = "auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false," + lock + "}"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Dashboard: lock ajustado')

          p = Path('visitor-tracker.js')
          s = p.read_text(encoding='utf-8')
          old = "return api.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}})"
          new = "return api.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false," + lock + "}})"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Tracker: lock ajustado')
          elif lock in s:
              print('Tracker: lock já presente')
          else:
              print('Tracker: padrão não localizado')

          # Expõe o cliente principal para módulos auxiliares futuros.
          p = Path('admin-v3.html')
          s = p.read_text(encoding='utf-8')
          marker = "sb=supabase.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false,lock:async(_name,_acquireTimeout,fn)=>await fn()}});"
          if marker in s and 'window.__NP_ADMIN_SB=sb' not in s:
              s = s.replace(marker, marker + "window.__NP_ADMIN_SB=sb;", 1)
              p.write_text(s, encoding='utf-8')
              print('ADM: cliente principal exposto')

          # Força o navegador a buscar os módulos atualizados.
          p = Path('admin-v3.html')
          s = p.read_text(encoding='utf-8')
          for old_tag, new_tag in {
              'admin-modern.js"': 'admin-modern.js?v=20260910-3"',
              'admin-dashboard.js"': 'admin-dashboard.js?v=20260910-3"',
              'visitor-tracker.js"': 'visitor-tracker.js?v=20260910-3"',
          }.items():
              if new_tag not in s and old_tag in s:
                  s = s.replace(old_tag, new_tag, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit e publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html admin-dashboard.js visitor-tracker.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: reforçar estabilidade e cache do ADM'
          git push
