name: Corrigir estabilidade do ADM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar clientes Supabase do ADM
        shell: python
        run: |
          from pathlib import Path

          lock = "lock:async(_name,_acquireTimeout,fn)=>await fn()"

          p = Path('admin-dashboard.js')
          s = p.read_text(encoding='utf-8')
          old = "auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}"
          new = "auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false," + lock + "}"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('visitor-tracker.js')
          s = p.read_text(encoding='utf-8')
          old = "return api.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}})"
          new = "return api.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false," + lock + "}})"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('admin-v3.html')
          s = p.read_text(encoding='utf-8')
          marker = "sb=supabase.createClient(U,K,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false,lock:async(_name,_acquireTimeout,fn)=>await fn()}});"
          if marker in s and 'window.__NP_ADMIN_SB=sb' not in s:
              s = s.replace(marker, marker + "window.__NP_ADMIN_SB=sb;", 1)

          import re
          s = re.sub(r'<script\s+src=["\']admin-modern\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          s = re.sub(r'<script\s+src=["\']admin-dashboard\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          s = re.sub(r'<script\s+src=["\']visitor-tracker\.js(?:\?[^"\']*)?["\']\s*></script>', '', s, flags=re.I)
          low=s.lower(); marker_head='</head>'; i=low.rfind(marker_head)
          if i<0: raise SystemExit('admin-v3.html sem </head>')
          tags='''<script src="admin-dashboard.js?v=20260910-3"></script><script src="visitor-tracker.js?v=20260910-3"></script><script src="admin-modern.js?v=20260910-3"></script>'''
          s=s[:i]+tags+s[i:]
          p.write_text(s,encoding='utf-8')

      - name: Commit e publicar
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-v3.html admin-dashboard.js visitor-tracker.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'fix: normalize admin runtime scripts'
          git push