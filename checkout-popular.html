<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nós Passa — Acesso popular</title><style>*{box-sizing:border-box}body{margin:0;background:#070a0e;color:#fff;font:14px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.hero,.card,.summary{background:#10161d;border:1px solid #29323d;border-radius:18px}.hero{padding:28px;background:radial-gradient(circle at 80% 10%,#37300d,#10161d 55%)}.brand{font-size:25px;font-weight:950;color:#fff;text-decoration:none}.brand b{color:#e4c64a}.eyebrow{display:inline-block;margin-top:24px;padding:7px 10px;border-radius:999px;background:#211d0c;color:#ead166;border:1px solid #4a411c;font-size:10px;font-weight:900}.hero h1{font-size:clamp(32px,6vw,54px);letter-spacing:-2px;margin:14px 0 8px}.muted{color:#99a4b0;line-height:1.6}.price-note{margin-top:18px;color:#dfe5ea}.price-note b{color:#e4c64a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.card{padding:20px;cursor:pointer}.card.selected{border-color:#e4c64a;box-shadow:0 0 0 1px #e4c64a}.card h2{margin:0 0 9px}.price{font-size:31px;font-weight:950;margin:16px 0 2px}.installment{color:#e4c64a;font-weight:850}.valid{margin-top:12px;font-size:12px;color:#8be3b7}.btn{border:0;border-radius:10px;padding:12px 16px;background:#e4c64a;color:#111;font-weight:900;cursor:pointer;text-decoration:none;display:inline-flex}.secondary{background:#252d37;color:#fff;border:1px solid #3a4551}.summary{margin-top:18px;padding:18px}.summary strong{color:#f2d86b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.msg{margin-top:16px;padding:12px;border-radius:10px}.err{background:#351b20;color:#ffb4b4}.loading{text-align:center;padding:35px;color:#8f99a5}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><section class="hero"><a class="brand" href="concursos.html">Nós <b>Passa</b></a><span class="eyebrow">PREPARAÇÃO POPULAR • 1 ANO</span><h1>Estude sem pesar no bolso.</h1><p class="muted">Preparação objetiva, preço baixo e acesso suficiente para você realmente estudar.</p><div class="price-note"><b>R$ 12 no ano</b> — equivalente a <b>R$ 1 por mês</b>.</div></section><div id="grid" class="grid"><div class="loading">Carregando preparações…</div></div><div id="summary" class="summary" style="display:none"></div><div class="actions"><button id="continue" class="btn" disabled>Continuar para pagamento</button><a class="btn secondary" href="concursos.html">Voltar</a></div><div id="msg"></div></main><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';let sb,courses=[],selected=null,$=id=>document.getElementById(id);function load(){return new Promise((ok,no)=>{if(window.supabase?.createClient)return ok(window.supabase);let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.async=true;s.onload=()=>ok(window.supabase);s.onerror=no;document.head.appendChild(s)})}function esc(v){return String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m))}function render(){ $('grid').innerHTML=courses.map(c=>`<div class="card ${selected===c.id?'selected':''}" onclick="selectCourse(${c.id})"><h2>${esc(c.name)}</h2><p class="muted">${esc(c.description||'Preparação completa para o curso selecionado.')}</p><div class="price">R$ 12</div><div class="installment">≈ R$ 1/mês por 12 meses</div><div class="valid">✓ 1 ano de acesso</div></div>`).join('');$('continue').disabled=!selected;let c=courses.find(x=>x.id===selected);$('summary').style.display=c?'block':'none';if(c)$('summary').innerHTML=`Preparação: <strong>${esc(c.name)}</strong> · Valor anual: <strong>R$ 12,00</strong>`}function selectCourse(id){selected=id;render()}async function init(){try{sb=(await load()).createClient(U,K);let s=await sb.auth.getSession();if(!s.data.session){sessionStorage.setItem('ap_target',location.href);location.replace('login.html');return}let r=await sb.from('courses').select('id,name,slug,description,price_cents').eq('active',true).order('id');courses=r.data||[];let req=new URLSearchParams(location.search).get('course');let f=courses.find(c=>String(c.id)===String(req)||c.slug===req);if(f)selected=f.id;render()}catch(e){$('msg').className='msg err';$('msg').textContent='Não foi possível carregar o checkout. Tente novamente.'}}$('continue').onclick=async()=>{if(!selected)return;let s=await sb.auth.getSession();if(!s.data.session){sessionStorage.setItem('ap_target',location.href);location.replace('login.html');return}let c=courses.find(x=>x.id===selected);$('continue').disabled=true;$('continue').textContent='Preparando…';let p=await sb.from('purchases').insert({user_id:s.data.session.user.id,course_id:c.id,amount_cents:1200,currency:'BRL',status:'pending',provider:'mercadopago'}).select('id').single();if(p.error){$('msg').className='msg err';$('msg').textContent=p.error.message;$('continue').disabled=false;return}let r=await sb.functions.invoke('create-payment',{body:{purchase_id:p.data.id}});if(r.error||!r.data?.init_point){$('msg').className='msg err';$('msg').textContent='O pagamento ainda não está configurado. Verifique a função de pagamento.';$('continue').disabled=false;return}location.href=r.data.init_point};init();</script></body></html>
