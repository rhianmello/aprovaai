<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Transpetro 2026 — escolha seu cargo e encontre a preparação específica no Nós Passa.">
<title>Nós Passa — Transpetro 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#050608;--panel:#0d1117;--panel2:#10161d;--line:#27313b;--text:#f5f7fa;--muted:#929da9;--blue:#59bce9;--gold:#e5c65a;--green:#45d49d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,#17232e,#050608 42%);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1160px;margin:auto;padding:0 22px}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:950;color:#fff;text-decoration:none}.brand b{color:var(--gold)}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;padding:12px 17px;background:var(--gold);color:#111;text-decoration:none;font-size:12px;font-weight:950;border:1px solid transparent;transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}.dark{background:#121820;color:#fff;border-color:#303945}.hero{text-align:center;padding:78px 0 68px;border-bottom:1px solid var(--line)}.eyebrow{display:inline-block;border:1px solid #31536a;background:#0d1922;color:var(--blue);border-radius:99px;padding:8px 12px;font-size:9px;font-weight:950;letter-spacing:1.5px}.hero h1{font-size:clamp(46px,7vw,76px);line-height:.97;letter-spacing:-4px;margin:22px 0 18px}.hero h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:700px;margin:auto;color:#aab3bd;line-height:1.65}.section{padding:62px 0}.center{text-align:center}.kicker{color:var(--blue);font-size:9px;font-weight:950;letter-spacing:2px;text-transform:uppercase}.section h2{font-size:clamp(30px,4vw,44px);letter-spacing:-2px;margin:10px 0}.lead{max-width:700px;margin:auto;color:var(--muted);line-height:1.6}.catalog-section{padding:26px 0 38px}.catalog-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.catalog-heading h2{margin:0;font-size:clamp(23px,3vw,31px);letter-spacing:-1.2px}.catalog-heading p{margin:0;color:#687582;font-size:10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-height:245px;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#11161d,#090c10);box-shadow:0 14px 35px rgba(0,0,0,.12);transition:.2s}.card:hover{border-color:#38566a;transform:translateY(-2px)}.card-tag{display:inline-flex;align-self:flex-start;border:1px solid #293944;background:#0c151c;color:#7faec7;border-radius:99px;padding:6px 9px;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.card h3{font-size:17px;line-height:1.3;margin:17px 0 10px}.card-desc{color:#8995a1;font-size:11px;line-height:1.55;margin:0 0 16px}.school{margin-top:auto;padding-top:14px;border-top:1px solid #1d252d}.school-label{display:block;color:#697581;font-size:8px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px}.school-value{color:#e4e9ee;font-size:11px;font-weight:800}.card .btn{margin-top:17px;width:100%;padding:11px 14px}.empty{grid-column:1/-1;text-align:center;padding:30px;border:1px dashed #303b45;border-radius:16px;color:#7e8994;background:#0a0e13;font-size:11px}.loading{min-height:45vh;display:grid;place-items:center;color:#9aa5b1;font-size:12px}.error{max-width:720px;margin:55px auto;padding:30px;border:1px solid #4a2c30;border-radius:18px;background:#171014;text-align:center}.error h3{margin:0 0 8px}.error p{margin:0;color:#a58e94;font-size:11px;line-height:1.6}.footer{padding:50px 0 90px;text-align:center;color:#606a75;font-size:9px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:0 14px}.nav{height:62px}.hero{padding:58px 0}.hero h1{letter-spacing:-2px}.section{padding:48px 0}.catalog-section{padding:20px 0 30px}.catalog-heading{display:block}.catalog-heading p{margin-top:7px}.grid{grid-template-columns:1fr}.card{min-height:0}.card h3{font-size:16px}}
</style>

<script src="visitor-tracker.js"></script></head>
<body>
<div class="wrap"><header class="nav"><a class="brand" href="concursos.html">Nós <b>Passa</b></a><a class="btn dark" href="login.html">Entrar</a></header></div>
<main id="app"><div class="loading">Carregando cargos e preparações…</div></main>
<footer class="footer">© 2026 Nós Passa • Preparação objetiva para concursos.</footer>
<script>
const U='https://ztqtcbzjesrkuaijmylm.supabase.co';
const K='sb_publishable_'+'Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';
const sb=supabase.createClient(U,K);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const prefix='Transpetro 2026 — ';
function classification(slug){
  const s=String(slug||'');
  if(s.startsWith('transpetro-2026-03-'))return{key:'terra-medio',title:'Terra — Nível Médio',school:'Ensino Médio'};
  if(s.startsWith('transpetro-2026-04-'))return{key:'terra-superior',title:'Terra — Nível Superior',school:'Ensino Superior'};
  if(s.startsWith('transpetro-2026-01-'))return{key:'mar-guarnicao',title:'Mar — Suboficiais e Guarnição',school:'Conforme edital'};
  if(s.startsWith('transpetro-2026-02-'))return{key:'mar-oficiais',title:'Mar — Oficiais',school:'Conforme edital'};
  if(s==='transpetro')return{key:'terra-superior',title:'Terra — Nível Superior',school:'Ensino Superior'};
  return null;
}
function displayName(name){return String(name||'').replace(/^Transpetro 2026\s*[—–-]\s*/i,'').trim()||'Preparação Transpetro 2026'}
function courseHref(c){return c.slug==='transpetro'?'transpetro-landing-v2.html':'curso-landing.html?course='+encodeURIComponent(c.slug)}
function card(c){const g=classification(c.slug),name=displayName(c.name),desc=String(c.description||'').trim();return `<article class="card"><span class="card-tag">Transpetro 2026</span><h3>${esc(name)}</h3>${desc?`<p class="card-desc">${esc(desc)}</p>`:'<p class="card-desc">Preparação específica para o cargo, com conteúdo, questões e simulados.</p>'}<div class="school"><span class="school-label">Escolaridade</span><span class="school-value">${esc(g.school)}</span></div><a class="btn" href="${courseHref(c)}">Acessar preparação →</a></article>`}
const sections=[
 {key:'terra-medio',title:'Terra — Nível Médio'},
 {key:'terra-superior',title:'Terra — Nível Superior'},
 {key:'mar-guarnicao',title:'Mar — Suboficiais e Guarnição'},
 {key:'mar-oficiais',title:'Mar — Oficiais'}
];
function render(courses){
 const groups={};sections.forEach(s=>groups[s.key]=[]);courses.forEach(c=>{const g=classification(c.slug);if(g&&groups[g.key])groups[g.key].push(c)});
 document.getElementById('app').innerHTML=`<section class="hero"><div class="wrap"><span class="eyebrow">TRANSPETRO 2026</span><h1>Escolha seu cargo.<br><em>Estude com foco.</em></h1><p>Encontre a preparação específica para o cargo que você deseja.</p></div></section><section class="section"><div class="wrap"><div class="center"><span class="kicker">Catálogo de preparações</span><h2>Encontre seu cargo.</h2><p class="lead">Selecione uma preparação para acessar o ambiente específico do cargo.</p></div>${sections.map(s=>`<section class="catalog-section"><div class="catalog-heading"><h2>${s.title}</h2><p>${groups[s.key].length} preparação${groups[s.key].length===1?'':'ões'}</p></div><div class="grid">${groups[s.key].length?groups[s.key].map(card).join(''):'<div class="empty">Nenhuma preparação ativa encontrada nesta categoria.</div>'}</div></section>`).join('')}</div></section>`;
}
async function load(){
 try{
  const {data,error}=await sb.from('courses').select('id,name,slug,description,active,price_cents').eq('active',true).or('slug.eq.transpetro,slug.like.transpetro-2026-*').order('name');
  if(error)throw error;
  render((data||[]).filter(c=>classification(c.slug)));
 }catch(error){
  console.error('Erro ao carregar cursos Transpetro:',error);
  document.getElementById('app').innerHTML=`<section class="section"><div class="wrap"><div class="error"><h3>Não foi possível carregar as preparações.</h3><p>Tente atualizar a página. Nenhum dado foi alterado no Supabase.</p></div></div></section>`;
 }
}
load();
</script>
</body>
</html>
