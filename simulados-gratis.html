<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Faça um simulado grátis no Nós Passa e teste seu nível antes de escolher sua preparação para concursos."><meta name="robots" content="index,follow"><link rel="canonical" href="https://www.nospassa.com.br/simulados-gratis.html"><title>Nós Passa — Simulados grátis</title><style>:root{--bg:#0b0e12;--p:#151a20;--l:#2b333d;--g:#e4c64a;--m:#aab2bd;--ok:#8be3b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24200f,#0b0e12 45%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1080px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:26px;font-weight:900;color:#fff;text-decoration:none}.brand b{color:var(--g)}.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:var(--g);color:#111;font-weight:900;text-decoration:none;cursor:pointer}.dark{background:#252c34;color:#fff;border:1px solid #3a424d}.hero{margin-top:20px;padding:28px;border:1px solid #40391c;border-radius:20px;background:linear-gradient(135deg,#171b21,#332c12)}h1{font-size:40px;margin:8px 0}.muted{color:var(--m);line-height:1.55}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:240px;padding:12px;border-radius:10px;border:1px solid var(--l);background:#10151b;color:#fff}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice,.q,.result{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:18px}.choice{cursor:pointer}.choice:hover,.choice.selected{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}.icon{font-size:28px}.choice h2{font-size:16px;margin:8px 0 5px}.free{color:var(--ok);font-size:11px;font-weight:bold}.sim{margin-top:22px}.q{margin-bottom:14px}.qhead{color:var(--g);font-size:11px;font-weight:bold;text-transform:uppercase}.q h3{line-height:1.5}.alts{display:grid;gap:8px}.alt{padding:12px;text-align:left;border-radius:9px;border:1px solid #39414b;background:#20262d;color:#fff;cursor:pointer}.alt.correct{background:#173126;border-color:#49b87e}.alt.wrong{background:#351c1f;border-color:#d46a6a}.score{font-size:42px;color:var(--g);font-weight:900}.empty{padding:28px;text-align:center;color:var(--m)}@media(max-width:850px){.choices{grid-template-columns:1fr 1fr}}@media(max-width:600px){.choices{grid-template-columns:1fr}h1{font-size:32px}.actions{display:none}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="visitor-tracker.js"></script></head><body><div class="wrap"><header class="top"><a class="brand" href="concursos.html">Nós <b>Passa</b></a><div class="actions"><a class="btn dark" href="concursos.html">Cursos</a></div></header><section class="hero"><div class="free">100% GRÁTIS • SEM CADASTRO</div><h1>Teste seu nível</h1><p class="muted">Escolha qualquer preparação do catálogo e faça 3 questões. Os testes gratuitos são uma amostra rápida para você conhecer a plataforma antes de assinar.</p></section><div class="toolbar"><input id="search" placeholder="🔎 Buscar cargo ou concurso…"></div><section id="choices" class="choices"><div class="empty">Carregando preparações…</div></section><section id="sim" class="sim"><div class="q">Escolha um curso acima para começar.</div></section></div><script src="simulados-gratis-banco.js"></script><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_'+'Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let courses=[],current=null,questions=[],score=0,answered=0;const generic=[{assunto:'Língua Portuguesa',enunciado:'Em um texto, a ideia principal corresponde ao conteúdo central que organiza as informações apresentadas. Qual alternativa melhor define essa ideia?',alternativas:{A:'Um detalhe isolado sem relação com o tema.',B:'O assunto central desenvolvido pelo texto.',C:'Uma informação necessariamente numérica.',D:'Uma opinião sempre contrária ao autor.',E:'Uma palavra repetida várias vezes.'},gabarito:'B'},{assunto:'Matemática',enunciado:'Um produto custa R$ 200,00 e recebe desconto de 10%. Qual é o novo preço?',alternativas:{A:'R$ 170,00',B:'R$ 175,00',C:'R$ 180,00',D:'R$ 185,00',E:'R$ 190,00'},gabarito:'C'},{assunto:'Língua Inglesa',enunciado:'Na frase “The technician checks the equipment every day”, a expressão “every day” indica:',alternativas:{A:'Lugar.',B:'Causa.',C:'Frequência.',D:'Possibilidade.',E:'Finalidade.'},gabarito:'C'}];function icon(name){const s=(name||'').toLowerCase();if(s.includes('mar'))return'⚓';if(s.includes('saúde')||s.includes('enfermagem')||s.includes('medicina')||s.includes('nutrição')||s.includes('odontologia'))return'🩺';if(s.includes('engenharia')||s.includes('elétrica')||s.includes('automação')||s.includes('eletricista'))return'⚙️';return'📚'}function group(c){if(c.slug?.startsWith('transpetro-2026-03-'))return'Terra • Nível Médio';if(c.slug?.startsWith('transpetro-2026-04-'))return'Terra • Nível Superior';if(c.slug?.startsWith('transpetro-2026-01-'))return'Mar • Suboficiais e Guarnição';if(c.slug?.startsWith('transpetro-2026-02-'))return'Mar • Oficiais';if(c.slug==='transpetro')return'Terra • Nível Superior';if(c.slug==='ace-marica')return'ACE Maricá';return'Outros'}function renderChoices(){const q=$('search').value.trim().toLowerCase();const list=courses.filter(c=>!q||[c.name,c.description,group(c)].join(' ').toLowerCase().includes(q));$('choices').innerHTML=list.length?list.map(c=>`<div class="choice ${current===c.slug?'selected':''}" data-course="${esc(c.slug)}"><div class="icon">${icon(c.name)}</div><h2>${esc(c.name)}</h2><p class="muted">${esc(c.description||group(c))}</p><div class="free">3 questões grátis</div></div>`).join(''):'<div class="empty">Nenhuma preparação encontrada.</div>';document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>start(x.dataset.course))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(slug){current=slug;score=0;answered=0;renderChoices();const staticBank=window.NOS_PASSA_FREE_BANK?.[slug]||[];questions=shuffle(staticBank.length>=3?staticBank:generic).slice(0,3);render()}function render(){$('sim').innerHTML='<h2>'+esc(courses.find(c=>c.slug===current)?.name||'Preparação')+' — 3 questões</h2>'+questions.map((q,i)=>'<article class="q" data-q="'+i+'"><div class="qhead">Questão '+(i+1)+' de 3 • '+esc(q.assunto)+'</div><h3>'+esc(q.enunciado)+'</h3><div class="alts">'+shuffle(Object.keys(q.alternativas)).map(k=>'<button class="alt" data-k="'+k+'" onclick="answer('+i+',\''+k+'\',this)"><b>'+k+') </b>'+esc(q.alternativas[k])+'</button>').join('')+'</div></article>').join('')+'<div id="result" class="result" style="display:none"></div>'}function answer(i,k,b){const box=document.querySelector('[data-q="'+i+'"]');if(box.dataset.done)return;box.dataset.done='1';answered++;const q=questions[i];box.querySelectorAll('.alt').forEach(x=>{x.disabled=true;if(x.dataset.k===q.gabarito)x.classList.add('correct')});if(k===q.gabarito)score++;else b.classList.add('wrong');if(answered===3)finish()}function finish(){const r=$('result');r.style.display='block';const pct=Math.round(score/3*100),c=courses.find(x=>x.slug===current),landing='curso-landing.html?course='+encodeURIComponent(current);r.innerHTML='<div class="score">'+score+'/3</div><h2>'+(score===3?'Excelente!':score===2?'Bom resultado!':'Agora você já sabe onde precisa estudar.')+'</h2><p class="muted">Aproveitamento: '+pct+'%. Quer conhecer a preparação completa?</p><a class="btn" href="'+landing+'">Conhecer curso</a>'}async function init(){try{const sb=supabase.createClient(U,K);const{data,error}=await sb.from('courses').select('id,name,slug,description,active').eq('active',true).order('id');if(error)throw error;courses=data||[];renderChoices();const req=new URLSearchParams(location.search).get('course');if(req&&courses.some(c=>c.slug===req))start(req)}catch(e){console.error(e);$('choices').innerHTML='<div class="empty">Não foi possível carregar os cursos. Atualize a página.</div>'}}$('search').oninput=renderChoices;init();</script><script src="simulados-gratis-ui.js"></script></body></html>
