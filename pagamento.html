<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nós Passa — Assinatura</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="brand.js"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1014;color:#fff;font:15px Arial;padding:20px}.box{width:min(560px,100%);background:#181d23;border:1px solid #303740;border-radius:18px;padding:28px;text-align:center}.icon{font-size:48px}.muted{color:#a6adb7;line-height:1.5}.btn{display:inline-block;margin-top:15px;padding:11px 16px;border-radius:9px;background:#e4c64a;color:#111;font-weight:800;text-decoration:none}.ok{color:#8be3b7}.warn{color:#f2d86b}.err{color:#ffb4b4}.err a{color:#f2d86b;font-weight:800}</style><script src="visitor-tracker.js"></script></head><body><main class="box"><div id="app"><div class="icon">⏳</div><h1>Confirmando sua assinatura</h1><p class="muted">Estamos aguardando a confirmação do Mercado Pago. A cobrança é de R$ 1,00 por mês e o acesso fica liberado enquanto os pagamentos estiverem em dia.</p><p id="status" class="warn">Consultando...</p></div></main><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d');const $=id=>document.getElementById(id);const purchaseId=new URLSearchParams(location.search).get('purchase')||sessionStorage.getItem('pending_purchase_id');async function check(){if(!purchaseId){$('status').textContent='Não encontramos a assinatura nesta sessão.';return true}const{data:{user}}=await sb.auth.getUser();if(!user){$('status').textContent='Entre novamente para consultar a assinatura.';return true}const{data:p}=await sb.from('purchases').select('id,status,course_id,billing_mode,next_billing_at').eq('id',purchaseId).eq('user_id',user.id).maybeSingle();if(!p){$('status').textContent='Assinatura não encontrada.';return true}if(p.status==='paid'){const{data:c}=await sb.from('courses').select('slug,name').eq('id',p.course_id).maybeSingle();$('app').innerHTML=`<div class="icon">✅</div><h1>Pagamento confirmado!</h1><p class="muted">Seu acesso ao <b>${c?.name||'curso'}</b> foi liberado por 1 mês. A assinatura continuará em R$ 1,00/mês enquanto estiver ativa.</p><p class="ok">Tudo certo. Você já pode começar a estudar.</p><a class="btn" href="minha-conta.html">Ir para meus cursos</a>`;sessionStorage.removeItem('pending_purchase_id');return true}if(p.status==='failed'||p.status==='cancelled'||p.status==='refunded'){$('status').innerHTML='O pagamento não foi aprovado. <a href="checkout-popular.html">Tentar novamente</a> ou volte para seus cursos.';$('status').className='err';return true}$('status').textContent='Pagamento pendente. Se você ainda não concluiu o pagamento no Mercado Pago, finalize-o e esta página será atualizada automaticamente.';return false}async function loop(){const done=await check();if(!done)setTimeout(loop,3000)}loop();</script></body></html>
