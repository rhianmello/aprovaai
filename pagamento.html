<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nós Passa — Pagamento</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1014;color:#fff;font:15px Arial;padding:20px}.box{width:min(620px,100%);background:#181d23;border:1px solid #303740;border-radius:18px;padding:28px;text-align:center}.icon{font-size:48px}.muted{color:#a6adb7;line-height:1.55}.btn{display:inline-block;margin:10px 5px 0;padding:12px 17px;border-radius:9px;background:#e4c64a;color:#111;font-weight:900;text-decoration:none}.secondary{background:#2b3139;color:#fff}.ok{color:#8be3b7}.warn{color:#f2d86b}.err{color:#ffb4b4}.offer{margin:18px 0;padding:16px;border:1px solid #4d4320;border-radius:13px;background:#17140b;color:#c8cfd6;line-height:1.8}.offer b{color:#f2d86b}.small{font-size:12px;color:#7f8994}</style><script src="visitor-tracker.js"></script></head><body><main class="box"><div id="app"><div class="icon">⏳</div><h1>Confirmando seu pagamento</h1><p id="status" class="muted">Aguardando o Mercado Pago…</p></div></main><script>const sb=supabase.createClient('https://ztqtcbzjesrkuaijmylm.supabase.co','sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),purchaseId=new URLSearchParams(location.search).get('purchase')||sessionStorage.getItem('pending_purchase_id');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}async function check(){if(!purchaseId){$("status").textContent='Não encontramos o pagamento nesta sessão.';return true}const{data:{user}}=await sb.auth.getUser();if(!user){$("status").textContent='Entre novamente para consultar o pagamento.';return true}const{data:p}=await sb.from('purchases').select('id,status,course_id,billing_mode,next_billing_at,metadata').eq('id',purchaseId).eq('user_id',user.id).maybeSingle();if(!p){$("status").textContent='Pagamento não encontrado.';return true}const{data:c}=await sb.from('courses').select('slug,name').eq('id',p.course_id).maybeSingle(),name=c?.name||'sua preparação',m=p.metadata||{},sub=m.subscription_id,subStatus=m.subscription_status||'pending',subLink=m.subscription_init_point||null;if(p.status==='paid'){if(sub&&subStatus!=='active'&&subStatus!=='authorized'){ $("app").innerHTML=`<div class="icon">✅</div><h1>Primeiro mês confirmado!</h1><p class="muted">Seu acesso ao <b>${esc(name)}</b> já foi liberado por 1 mês.</p><div class="offer"><b>Oferta da assinatura</b><br>Primeiro mês: <b>R$ 1,00</b><br>A partir do 2º mês: <b>R$ 5,90/mês</b><br><span class="small">A renovação automática começa após sua autorização no Mercado Pago.</span></div>${subLink?`<a class="btn" href="${subLink}">Autorizar renovação de R$ 5,90/mês →</a>`:'<p class="warn">Preparando a autorização da renovação…</p>'}<br><a class="btn secondary" href="minha-conta.html">Ir para meus cursos</a>`;sessionStorage.removeItem('pending_purchase_id');return !subLink}$("app").innerHTML=`<div class="icon">🎉</div><h1>Assinatura ativa!</h1><p class="muted">Seu acesso ao <b>${esc(name)}</b> está liberado. O primeiro mês foi R$ 1,00 e a renovação automática será de <b>R$ 5,90/mês</b>.</p><p class="ok">Próxima cobrança: ${p.next_billing_at?new Date(p.next_billing_at).toLocaleDateString('pt-BR'):'a confirmar'}.</p><a class="btn" href="minha-conta.html">Ir para meus cursos</a>`;sessionStorage.removeItem('pending_purchase_id');return true}if(['failed','cancelled','refunded'].includes(p.status)){const retry=c?.slug?`checkout-popular.html?course=${encodeURIComponent(c.slug)}`:'checkout-popular.html';$("app").innerHTML=`<div class="icon">⚠️</div><h1>Pagamento não concluído</h1><p class="muted">O pagamento não foi aprovado ou foi cancelado.</p><a class="btn" href="${retry}">Tentar novamente</a><a class="btn secondary" href="minha-conta.html">Minha conta</a>`;sessionStorage.removeItem('pending_purchase_id');return true}$("status").textContent='Pagamento pendente. Finalize no Mercado Pago; esta página será atualizada automaticamente.';return false}async function loop(){try{if(!(await check()))setTimeout(loop,3000)}catch(e){$("status").textContent='Não foi possível consultar agora. Atualize a página.'}}loop();</script></body></html>
