<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Importar questões | Nós Passa</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:980px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #00000008}h1{margin:0 0 6px}.muted{color:#667085}label{display:block;font-weight:700;margin:14px 0 7px}input,textarea,button{font:inherit}input[type=file],textarea{width:100%;box-sizing:border-box;border:1px solid #ccd3df;border-radius:10px;padding:11px;background:#fff}textarea{min-height:280px;font-family:ui-monospace,monospace;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:800}button.primary{background:#111827;color:#fff}button.secondary{background:#e8edf5;color:#172033}button:disabled{opacity:.5;cursor:not-allowed}.status{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:12px;padding:16px;min-height:80px}.ok{color:#86efac}.err{color:#fca5a5}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px;font-weight:800}
</style>
</head>
<body><main class="wrap">
<div class="card"><span class="badge">ADMIN</span><h1>Importador de questões</h1><p class="muted">Validação → dry-run → importação. O lote é enviado ao backend; a escrita usa uma função transacional do PostgreSQL.</p></div>
<div class="card">
<label>Arquivo JSON</label><input id="file" type="file" accept="application/json,.json">
<label>Ou cole o JSON</label><textarea id="payload" placeholder='{"schema_version":"1.0","batch":"TS - Administração lote 01","preparation_slug":"...","questions":[...]}'></textarea>
<div class="actions"><button class="secondary" id="load">Carregar arquivo</button><button class="primary" id="dry">Validar / Dry-run</button><button class="primary" id="import" disabled>Importar lote validado</button></div>
</div>
<div class="card"><h2>Resultado</h2><div id="status" class="status">Aguardando JSON…</div></div>
</main>
<script>
const URL='https://ztqtcbzjesrkuaijmylm.supabase.co';
const KEY='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';
const sb=supabase.createClient(URL,KEY);
let lastPayload=null;
const $=id=>document.getElementById(id);
function show(x,err=false){$('status').innerHTML='<span class="'+(err?'err':'ok')+'">'+escapeHtml(typeof x==='string'?x:JSON.stringify(x,null,2))+'</span>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('load').onclick=async()=>{const f=$('file').files[0];if(!f)return show('Selecione um arquivo.',true);$('payload').value=await f.text();show('Arquivo carregado. Clique em Validar / Dry-run.')};
async function call(mode){
 try{const payload=JSON.parse($('payload').value);lastPayload=payload;show('Processando…');
 const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Faça login como administrador antes de importar.');
 const r=await fetch(URL+'/functions/v1/import-question-batch',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({mode,payload})});
 const j=await r.json();if(!r.ok)throw new Error(j.error||'Falha no backend');show(j);if(mode==='dry_run'&&j.errors===0){$('import').disabled=false}else if(mode==='import'){$('import').disabled=true}
 }catch(e){$('import').disabled=true;show(e.message||String(e),true)}
}
$('dry').onclick=()=>call('dry_run');
$('import').onclick=()=>{if(confirm('Importar este lote no banco?'))call('import')};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){show('Sessão não encontrada. Faça login.',true);return}const {data:p}=await sb.from('profiles').select('role,active').eq('id',session.user.id).maybeSingle();if(!p||p.role!=='admin'||p.active!==true)show('Usuário sem permissão de administrador.',true)})();
</script></body></html>
