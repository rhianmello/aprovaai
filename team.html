<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Time — Nós Passa</title><meta name="description" content="Página do time com próximos jogos, calendário e resultados recentes."><style>
:root{--bg:#06100b;--panel:#08140d;--panel2:#0b1b12;--line:#1d3d29;--green:#62e38d;--text:#f3f7f4;--muted:#84998b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 50% -15%,#17462a 0,transparent 34%),var(--bg)}a{color:inherit}.wrap{width:min(1060px,calc(100% - 30px));margin:auto}
header{height:70px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font-size:25px;font-weight:950;text-decoration:none;letter-spacing:-1px}.brand b{color:var(--green)}.top{display:flex;align-items:center;gap:8px}.lang,.back,.admin-link{border:1px solid #22462f;background:#0a1710;color:#cbe0d2;border-radius:999px;padding:8px 10px;text-decoration:none;font-size:10px;font-weight:900}.back:hover{border-color:#4eab6d}.admin-link{background:var(--green);color:#06100b}
.team-loading,.team-error{margin-top:50px;border:1px solid var(--line);background:#08140d;border-radius:18px;padding:50px;text-align:center;color:#84998b}.team-error{color:#ff8d99}
.team-hero{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:center;border:1px solid var(--line);background:linear-gradient(145deg,#0b1e14,#07110b);border-radius:20px;padding:25px;margin-top:18px}.team-logo{width:100px;height:100px;border-radius:18px;background:#f8faf9;display:flex;align-items:center;justify-content:center;padding:10px}.team-logo img{max-width:100%;max-height:100%;object-fit:contain}.team-title>span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#7d9484;font-weight:900}.team-title h1{font-size:36px;letter-spacing:-1.5px;margin:5px 0 12px}.team-meta{display:flex;gap:10px;flex-wrap:wrap}.team-meta span{font-size:10px;color:#a5b5aa;border:1px solid #1c3a27;background:#09150e;border-radius:999px;padding:7px 9px}.team-meta b{color:#dce8df}
.team-tabs{display:flex;gap:4px;margin:13px 0;border:1px solid var(--line);background:#07130c;border-radius:14px;padding:6px;overflow:auto}.team-tabs button{border:0;background:transparent;color:#8ea293;padding:10px 14px;border-radius:9px;font-size:10px;font-weight:900;cursor:pointer;white-space:nowrap}.team-tabs button.active{background:#163923;color:#fff;box-shadow:inset 0 -2px 0 var(--green)}
.team-section{border:1px solid var(--line);background:#07130c;border-radius:17px;overflow:hidden;margin-bottom:13px}.team-section>h2{font-size:16px;margin:0;padding:15px;border-bottom:1px solid var(--line)}.team-league{border-top:1px solid #183120}.team-league:first-of-type{border-top:0}.team-league-head{display:flex;gap:8px;align-items:center;padding:9px 13px;background:#0b1b12;color:#aabbb0;font-size:9px;text-transform:uppercase}.team-league-head img{width:16px;height:16px;object-fit:contain}
.team-game{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid #14291c}.team-game:hover{background:#0d2015}.tg-date{font-size:10px;color:#9caf9f}.tg-date small{display:block;color:#65796b;font-size:8px;margin-top:3px}.tg-teams{display:grid;gap:6px}.tg-teams a{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:11px;font-weight:750}.tg-teams a:hover span{text-decoration:underline}.tg-teams img{width:20px;height:20px;object-fit:contain}.tg-score{display:grid;gap:6px;text-align:center;font-size:14px;font-weight:950}.tg-score small{font-size:7px;color:#6b7f71}.team-empty{padding:28px;text-align:center;color:#74897a;font-size:11px}

body.modal-open{overflow:hidden}.search-trigger{display:inline-flex;align-items:center;gap:7px;border:1px solid #244531;background:#0a1710;color:#d9e7dd;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:900;cursor:pointer}.search-trigger:hover{border-color:#57bd78;color:#fff}
.search-modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(7px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:12vh 18px 30px}.search-modal.open{display:flex}.search-card{width:min(620px,100%);border:1px solid #2b5639;background:#07110b;border-radius:18px;box-shadow:0 30px 100px #000;padding:17px}.search-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.search-head h2{margin:0;font-size:18px}.search-close{border:0;background:transparent;color:#9bb0a1;font-size:25px;cursor:pointer}.search-input-wrap{display:flex;align-items:center;gap:9px;border:1px solid #2a5238;background:#030906;border-radius:12px;padding:0 12px}.search-input-wrap input{flex:1;border:0;outline:0;background:transparent;color:#fff;padding:14px 0;font-size:14px}.search-results{max-height:54vh;overflow-y:auto;margin-top:10px}.search-result{display:grid;grid-template-columns:42px 1fr 20px;gap:10px;align-items:center;text-decoration:none;color:#fff;padding:10px;border-radius:11px;border-bottom:1px solid #15291d}.search-result:hover{background:#11271a}.search-result img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}.search-result strong{display:block;font-size:12px}.search-result span{display:block;color:#819689;font-size:9px;margin-top:4px}.search-result b{color:#62df8d}.search-state{padding:28px;text-align:center;color:#7f9386;font-size:11px}

@media(max-width:720px){.team-hero{grid-template-columns:72px 1fr;padding:17px}.team-logo{width:68px;height:68px}.team-title h1{font-size:27px}.team-game{grid-template-columns:95px 1fr 42px}.top .lang{display:none}.search-trigger span{display:none}}
.provider-credit{padding:22px 0 30px;text-align:right;color:#5f7566;font-size:9px}.provider-credit a{color:#86a990;text-decoration:none}.team-coverage{color:#a8bcae;border-left:3px solid #62e38d;background:#0d2015;padding:12px 15px;border-radius:8px;font-size:12px;line-height:1.5}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/visitor-tracker.js"></script><script defer src="/admin-access.js"></script><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3362799659309189" crossorigin="anonymous"></script></head>
