<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nós Passa — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1014;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#181d23;border:1px solid #303740;border-radius:20px;padding:28px}.logo{font-size:28px;font-weight:900;color:#fff;text-decoration:none}.logo b{color:#e4c64a}h1{margin:22px 0 8px}p{color:#a6adb7;line-height:1.5}label{display:block;margin-top:14px;color:#d8dde5;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid #343b45;background:#11161b;color:#fff;font-size:16px}.hint{font-size:12px;color:#8f98a4;margin-top:6px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer}.secondary{background:#2b3139;color:#fff}.msg{margin-top:14px;color:#ff9b9b}.ok{color:#8be3b7}.link{color:#ddd;text-decoration:none}</style></head><body><main class="box"><a class="logo" href="index.html">Nós <b>Passa</b></a><h1 id="title">Entrar no Nós Passa</h1><p id="desc">Faça login para acessar seus concursos e continuar seus estudos.</p><form id="form"><div id="nameWrap" style="display:none"><label>Nome completo<input id="name" type="text" autocomplete="name" minlength="2" placeholder="Ex.: João da Silva"></label><div class="hint">Usaremos seu nome para identificar sua conta e pedidos.</div><label>WhatsApp / celular<input id="phone" type="tel" autocomplete="tel" placeholder="(21) 99999-9999"></label><div class="hint">Usaremos o número apenas para identificação e contato sobre o pedido.</div></div><label>E-mail<input id="email" type="email" autocomplete="email" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><div class="actions"><button class="btn" id="submit" type="submit">Entrar</button><button class="btn secondary" id="toggle" type="button">Criar cadastro</button></div></form><div id="msg" class="msg"></div><p style="margin-top:18px"><a class="link" href="concursos.html">← Voltar para os concursos</a></p></main><script>const SUPABASE_URL='https://ztqtcbzjesrkuaijmylm.supabase.co',SUPABASE_KEY='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';let sb=null,signup=new URLSearchParams(location.search).get('cadastro')==='1';const title=document.getElementById('title'),desc=document.getElementById('desc'),submit=document.getElementById('submit'),toggle=document.getElementById('toggle'),nameWrap=document.getElementById('nameWrap'),name=document.getElementById('name'),phone=document.getElementById('phone'),email=document.getElementById('email'),password=document.getElementById('password'),form=document.getElementById('form'),msg=document.getElementById('msg');function render(){title.textContent=signup?'Criar cadastro':'Entrar no Nós Passa';desc.textContent=signup?'Crie sua conta para acessar os concursos e salvar seu progresso.':'Faça login para acessar seus concursos e continuar seus estudos.';submit.textContent=signup?'Criar conta':'Entrar';toggle.textContent=signup?'Já tenho cadastro':'Criar cadastro';nameWrap.style.display=signup?'block':'none';name.required=signup;phone.required=signup}function setMsg(t,ok=false){msg.className=ok?'msg ok':'msg';msg.textContent=t}function loadSupabase(){return new Promise((resolve,reject)=>{if(window.supabase?.createClient)return resolve(window.supabase);const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.async=true;s.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(new Error('Supabase não carregou'));s.onerror=()=>reject(new Error('Falha ao carregar o serviço de login'));document.head.appendChild(s)})}async function routeAfterLogin(){const{data:{user},error:userError}=await sb.auth.getUser();if(userError||!user){setMsg('A sessão foi criada, mas não conseguimos confirmar a conta. Atualize a página e tente novamente.');submit.disabled=false;return}const{data:isAdmin,error:adminError}=await sb.rpc('is_admin');if(!adminError&&isAdmin===true){sessionStorage.removeItem('ap_target');location.replace('admin-v3.html');return}const{data:rows,error}=await sb.from('user_courses').select('course_id,status,expires_at,courses(slug,active)').eq('user_id',user.id);if(error){sessionStorage.removeItem('ap_target');location.replace('minha-conta.html');return}const active=(rows||[]).filter(r=>r.status==='active').filter(r=>!r.expires_at||new Date(r.expires_at)>new Date()).filter(r=>r.courses?.active!==false);if(active.length===1){sessionStorage.removeItem('ap_target');const slug=String(active[0].courses?.slug||'');const url={"ace-marica":'ace_marica_app_fixed.html',transpetro:'transpetro.html','inspetor-eletrica':'inspetor_eletrica.html'}[slug];if(url){location.replace(url);return}location.replace('minha-conta.html');return}if(active.length>1){sessionStorage.removeItem('ap_target');location.replace('minha-conta.html');return}const raw=sessionStorage.getItem('ap_target');if(raw&& !raw.includes('index.html')&&!raw.endsWith('concursos.html')){sessionStorage.removeItem('ap_target');location.replace(raw);return}sessionStorage.removeItem('ap_target');location.replace('concursos.html')}render();toggle.onclick=()=>{signup=!signup;render();setMsg('')};form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;setMsg(signup?'Criando conta...':'Entrando...');try{const api=await loadSupabase();sb=api.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false}});let r;if(signup)r=await sb.auth.signUp({email:email.value.trim().toLowerCase(),password:password.value,options:{data:{full_name:name.value.trim(),nome:name.value.trim(),telefone:phone.value.trim()}}});else r=await sb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});if(r.error){setMsg(r.error.message);submit.disabled=false;return}if(signup&&!r.data.session){setMsg('Cadastro criado. Verifique seu e-mail se a confirmação estiver habilitada.',true);submit.disabled=false;return}await new Promise(r=>setTimeout(r,250));setMsg('Login realizado. Abrindo sua área...',true);await routeAfterLogin()}catch(err){setMsg(err.message||'Não foi possível conectar ao serviço de login. Tente novamente.');submit.disabled=false}};</script></body></html>
