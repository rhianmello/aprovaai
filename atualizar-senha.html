<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nós Passa — Nova senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1014;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#181d23;border:1px solid #303740;border-radius:20px;padding:28px}.logo{font-size:28px;font-weight:900;color:#fff;text-decoration:none}.logo b{color:#e4c64a}h1{margin:22px 0 8px}p{color:#a6adb7;line-height:1.5}label{display:block;margin-top:14px;color:#d8dde5;font-size:14px}input{width:100%;margin-top:7px;padding:12px;border-radius:9px;border:1px solid #343b45;background:#11161b;color:#fff;font-size:16px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 16px;background:#e4c64a;color:#111;font-weight:800;cursor:pointer}.secondary{background:#2b3139;color:#fff}.msg{margin-top:14px;color:#ff9b9b}.ok{color:#8be3b7}</style><script src="visitor-tracker.js"></script></head><body><main class="box"><a class="logo" href="index.html">Nós <b>Passa</b></a><h1>Crie uma nova senha</h1><p>Escolha uma senha com pelo menos 6 caracteres.</p><form id="form"><label>Nova senha<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><label>Confirmar senha<input id="confirm" type="password" minlength="6" autocomplete="new-password" required></label><div class="actions"><button class="btn" id="submit" type="submit">Atualizar senha</button></div></form><div id="msg" class="msg"></div></main><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_'+'Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';const form=document.getElementById('form'),password=document.getElementById('password'),confirmPassword=document.getElementById('confirm'),submit=document.getElementById('submit'),msg=document.getElementById('msg');function setMsg(t,ok=false){msg.className=ok?'msg ok':'msg';msg.textContent=t}function friendly(e){const s=String(e?.message||e||'').toLowerCase();if(s.includes('same password'))return'A nova senha precisa ser diferente da anterior.';if(s.includes('password'))return'A nova senha não atende aos requisitos. Use pelo menos 6 caracteres.';return'Não foi possível atualizar a senha. Solicite um novo link de recuperação.'}async function load(){if(window.supabase?.createClient)return window.supabase;return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>ok(window.supabase);s.onerror=()=>no(new Error('Supabase não carregou'));document.head.appendChild(s)})}let sb;async function init(){try{const api=await load();sb=api.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const{data}=await sb.auth.getSession();if(!data.session){setMsg('Este link de recuperação é inválido ou expirou. Solicite outro link.');submit.disabled=true}}catch(e){setMsg('Não foi possível iniciar a recuperação. Solicite outro link.');submit.disabled=true}}form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirmPassword.value){setMsg('As senhas não conferem.');return}submit.disabled=true;setMsg('Atualizando senha...');try{const r=await sb.auth.updateUser({password:password.value});if(r.error)throw r.error;setMsg('Senha atualizada. Redirecionando para o login...',true);await sb.auth.signOut({scope:'local'});setTimeout(()=>location.replace('login.html'),900)}catch(e){setMsg(friendly(e));submit.disabled=false}};init()</script></body></html>
