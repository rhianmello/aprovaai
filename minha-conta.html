<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nós Passa — Minha conta</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 0,#18232d,#06080b 42%);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:24px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:27px;font-weight:950;color:#fff;text-decoration:none}.brand b{color:#e4c64a}.user{color:#aeb7c0;font-size:12px}.actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 14px;background:#e4c64a;color:#111;text-decoration:none;font-size:12px;font-weight:950;border:0;cursor:pointer}.secondary{background:#151c24;color:#fff;border:1px solid #35404b}.hero{margin-top:48px}.eyebrow{display:inline-block;padding:7px 10px;border-radius:999px;background:#211d0c;color:#ead166;border:1px solid #4a411c;font-size:10px;font-weight:900}.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-3px;margin:16px 0 8px}.muted{color:#99a4b0;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.card{display:flex;flex-direction:column;padding:22px;border:1px solid #29323d;border-radius:18px;background:linear-gradient(145deg,#111821,#0b0f14);min-height:230px}.card h2{margin:10px 0 8px;font-size:21px}.badge{font-size:10px;color:#8be3b7;font-weight:900}.card .btn{margin-top:auto}.empty{margin-top:30px;padding:24px;border:1px solid #29323d;border-radius:16px;background:#10161d}.loading{padding:40px;text-align:center;color:#8f99a5}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.hero{margin-top:35px}.user{display:none}}</style></head><body><main class="wrap"><header class="nav"><a class="brand" href="concursos.html">Nós <b>Passa</b></a><div class="actions"><span id="user" class="user"></span><button class="btn secondary" onclick="logout()">Sair</button></div></header><section class="hero"><span class="eyebrow">ÁREA DO ALUNO</span><h1>Seus cursos.</h1><p class="muted">Entre diretamente no ambiente de estudos dos cursos que estão liberados para sua conta.</p></section><section id="content"><div class="loading">Consultando seus acessos…</div></section></main><script>const U='https://ztqtcbzjesrkuaijmylm.supabase.co',K='sb_publishable_Lh0A_Ykm2h66ur3LojJKTQ_JdUVMK9d';const MAP={1:{name:'ACE Maricá',url:'ace_marica_app_fixed.html'},2:{name:'Transpetro 2026 — Análise de Sistemas — SAP',url:'transpetro.html'},3:{name:'Transpetro 2026 — Inspetor de Elétrica Nível 1',url:'inspetor_eletrica.html'}};const esc=v=>String(v??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const sb=supabase.createClient(U,K);async function logout(){await sb.auth.signOut({scope:'local'});location.replace('login.html')}async function init(){const{data:{user},error}=await sb.auth.getUser();if(error||!user){location.replace('login.html');return}document.getElementById('user').textContent=user.email||'Conta';const{data:rows,error:e}=await sb.from('user_courses').select('course_id,status,expires_at').eq('user_id',user.id).eq('status','active');if(e){document.getElementById('content').innerHTML='<div class="empty">Não foi possível consultar seus cursos. Atualize a página e tente novamente.</div>';return}const active=(rows||[]).filter(r=>!r.expires_at||new Date(r.expires_at)>new Date()).filter(r=>MAP[r.course_id]);if(active.length===1){location.replace(MAP[active[0].course_id].url);return}if(!active.length){document.getElementById('content').innerHTML='<div class="empty"><h2>Você ainda não tem um curso liberado.</h2><p class="muted">Conheça as preparações disponíveis e escolha seu próximo objetivo.</p><a class="btn" href="concursos.html">Ver cursos</a></div>';return}document.getElementById('content').innerHTML='<div class="grid">'+active.map(r=>{const c=MAP[r.course_id];const expiry=r.expires_at?new Date(r.expires_at).toLocaleDateString('pt-BR'):'';return `<article class="card"><span class="badge">✓ ACESSO ATIVO${expiry?' · ATÉ '+esc(expiry):''}</span><h2>${esc(c.name)}</h2><p class="muted">Continue seus estudos, questões, simulados e plano de estudo.</p><a class="btn" href="${c.url}">📚 Estudar agora</a></article>`}).join('')+'</div><a class="btn secondary" href="concursos.html">← Ver outros cursos</a>'}init().catch(()=>{document.getElementById('content').innerHTML='<div class="empty">Não foi possível carregar sua conta. Atualize a página e tente novamente.</div>'});</script></body></html>
